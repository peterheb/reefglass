<html lang="en">

<body>
<title>Reefglass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" media="print" onload="this.media='all'">
<style>
  /* Single-look design: the page is a dark underwater world in every theme. */
  :root{
    color-scheme: dark;
    --abyss:#03141f;
    --glass:rgba(4,26,38,.58);
    --glass-strong:rgba(3,20,30,.78);
    --edge:rgba(150,228,226,.20);
    --ink:#e7f6f3;
    --ink-dim:#a3c6c6;
    --ink-faint:#6f9a9e;
    --coral:#ff9f5a;
    --seaglass:#7fe6d9;
    --f-ui:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-name:"Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --r:12px;
  }
  html,body{height:100%;margin:0;background:var(--abyss);overflow:hidden;}
  body{font-family:var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #tank{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--abyss);cursor:crosshair;touch-action:manipulation;}
  body.idle #tank{cursor:none;}

  /* Field-guide tag that follows a tapped fish */
  .tag{position:fixed;left:0;top:0;z-index:3;pointer-events:none;max-width:min(270px,calc(100vw - 32px));
    padding:10px 13px 11px;border-radius:var(--r);background:var(--glass-strong);border:1px solid var(--edge);
    backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
    display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .35s ease;will-change:transform;}
  .tag.show{opacity:1;}
  .tag-name{font-family:var(--f-name);font-size:19px;line-height:1.15;font-weight:500;letter-spacing:.005em;text-wrap:balance;}
  .tag-sci{font-family:var(--f-name);font-style:italic;font-size:14px;color:var(--seaglass);}
  .tag-fact{font-size:12.5px;line-height:1.4;color:var(--ink-dim);margin-top:4px;}

  /* Documentary lower-third for special visitors */
  .caption{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left,0px) + 16px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);max-width:calc(100vw - 32px);pointer-events:none;
    display:flex;flex-direction:column;gap:3px;padding-left:14px;border-left:2px solid var(--coral);
    opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease;}
  .caption.show{opacity:1;transform:none;}
  .cap-kicker{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);}
  .cap-name{font-family:var(--f-name);font-size:clamp(24px,3.2vw,40px);line-height:1.05;font-weight:400;text-shadow:0 2px 18px rgba(0,10,20,.55);text-wrap:balance;}
  .cap-sci{font-family:var(--f-name);font-style:italic;font-size:clamp(14px,1.5vw,18px);color:var(--ink-dim);text-shadow:0 1px 10px rgba(0,10,20,.6);}
  .cap-fact{font-size:13px;line-height:1.45;color:var(--ink-dim);max-width:44ch;margin-top:4px;text-shadow:0 1px 10px rgba(0,10,20,.7);}

  /* Control dock */
  .dock{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 16px);
    width:min(318px,calc(100vw - 32px));box-sizing:border-box;padding:12px;border-radius:14px;background:var(--glass);
    border:1px solid var(--edge);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
    display:flex;flex-direction:column;gap:10px;transition:opacity .6s ease,transform .6s ease,visibility 0s;}
  .dock-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .brand{font-family:var(--f-name);font-size:21px;font-weight:500;letter-spacing:.01em;}
  .brand i{color:var(--seaglass);font-weight:400;}
  .clock{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;border-radius:10px;background:rgba(0,12,20,.45);border:1px solid rgba(150,228,226,.10);}
  .seg button{appearance:none;border:0;background:transparent;color:var(--ink-dim);font:500 12.5px/1 var(--f-ui);padding:8px 0;border-radius:8px;cursor:pointer;}
  .seg button[aria-pressed="true"]{background:rgba(127,230,217,.16);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(127,230,217,.28);}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .btn{appearance:none;border:1px solid rgba(150,228,226,.16);background:rgba(0,12,20,.35);color:var(--ink);
    font:500 13px/1 var(--f-ui);padding:10px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;}
  .btn:hover,.seg button:hover{color:var(--ink);background:rgba(127,230,217,.10);}
  .btn[aria-pressed="true"]{border-color:rgba(255,159,90,.55);color:#ffd9bd;}
  .btn svg{width:15px;height:15px;flex:none;}
  .btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--seaglass);outline-offset:2px;}
  .hint{margin:0;font-size:12px;line-height:1.45;color:var(--ink-faint);}
  .hint b{color:var(--ink-dim);font-weight:500;}
  .dock-foot{display:flex;justify-content:flex-end;margin-top:-4px;}
  .credit{font-family:var(--f-name);font-style:italic;font-size:12px;color:var(--ink-faint);opacity:.75;white-space:nowrap;}

  /* Movement only reveals a small handle; the panel opens on click (and on first load) */
  .dock-tab{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 16px);
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--ink-dim);
    background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
    transition:opacity .6s ease;}
  .dock-tab svg{width:17px;height:17px;}
  .dock-tab:hover{color:var(--ink);}
  .dock-tab:focus-visible{outline:2px solid var(--seaglass);outline-offset:2px;}
  body.open .dock-tab,body.idle .dock-tab{opacity:0;pointer-events:none;}
  body:not(.open) .dock{opacity:0;transform:translateY(-6px);pointer-events:none;visibility:hidden;transition:opacity .6s ease,transform .6s ease,visibility 0s .6s;}
  @media (max-width:520px){
    .dock{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:10px;gap:8px;}
    .caption{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 18px);}
    .hint{display:none;}
    .dock-tab{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);}
  }
  @media (prefers-reduced-motion:reduce){ .tag,.caption,.dock,.dock-tab{transition:none;} }
</style>

<canvas id="tank" aria-label="An animated coral reef aquarium"></canvas>

<div id="tag" class="tag" role="status" aria-live="polite">
  <span class="tag-name"></span><span class="tag-sci"></span><span class="tag-fact"></span>
</div>

<div id="caption" class="caption" role="status" aria-live="polite">
  <span class="cap-kicker">Special visitor</span>
  <span class="cap-name"></span>
  <span class="cap-sci"></span>
  <span class="cap-fact"></span>
</div>

<div id="dock" class="dock">
  <div class="dock-head">
    <span class="brand">Reef<i>glass</i></span>
    <span class="clock" id="clock">Midday</span>
  </div>
  <div class="seg" role="group" aria-label="Lighting">
    <button id="modeLive" data-mode="live" aria-pressed="true" title="Follows your local sunrise, sunset and moon">Live</button>
    <button id="modeDemo" data-mode="cycle" aria-pressed="false" title="A whole day in seven minutes, with frequent visitors">Demo</button>
    <button id="modeDay" data-mode="day" aria-pressed="false">Day</button>
    <button id="modeNight" data-mode="night" aria-pressed="false">Night</button>
  </div>
  <div class="actions">
    <button class="btn" id="btnFeed" type="button"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="4" cy="5" r="1.6"/><circle cx="9" cy="3.5" r="1.3"/><circle cx="12" cy="7" r="1.5"/><circle cx="6.5" cy="9.5" r="1.4"/><circle cx="10" cy="12.5" r="1.2"/></svg>Feed</button>
    <button class="btn" id="btnVisitor" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1.5 8.5c2.5-3.5 6-4.5 9.5-2.5l3-2v8l-3-2c-3.5 2-7 1-9.5-1.5z"/><circle cx="5" cy="7.6" r=".7" fill="currentColor"/></svg>Call a visitor</button>
    <button class="btn" id="btnSound" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 6h2.5L8 3v10L4.5 10H2z" fill="currentColor" stroke="none"/><path d="M10.5 5.5c1 1.4 1 3.6 0 5M12.5 3.8c2 2.4 2 6 0 8.4"/></svg><span>Sound off</span></button>
    <button class="btn" id="btnFull" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>Full screen</button>
  </div>
  <p class="hint"><b>Tap the water</b> to drop food. <b>Tap a fish</b> to learn what it is. <b>Live</b> follows your clock; <b>Demo</b> runs a whole day in minutes.</p>
  <div class="dock-foot">
    <span class="credit">by Claude Opus 5.5</span>
  </div>
</div>

<button id="dockTab" class="dock-tab" type="button" aria-label="Show controls" title="Show controls"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg></button>

<script>
'use strict';
/* =====================================================================
   Reefglass — core utilities, canvas, sprites, time of day
   ===================================================================== */
const TAU = Math.PI * 2;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const ease = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * Math.max(0, dt)));
const sgn = (v) => (v < 0 ? -1 : 1);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// seeded helpers used by painters (set per painting pass)
let SR = mulberry32(1);
const srand = (a = 1, b) => (b === undefined ? SR() * a : a + SR() * (b - a));
const spick = (arr) => arr[Math.floor(SR() * arr.length)];

/* ---------- value noise ---------- */
function hash1(i) { let h = Math.imul(i ^ 0x27d4eb2d, 0x165667b1); h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; return (h >>> 0) / 4294967296; }
function hash2(i, j) { return hash1(i * 374761393 + j * 668265263); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u) * 2 - 1; }
function fbm1(x, oct = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let o = 0; o < oct; o++) { s += a * noise1(x * f + o * 17.3); n += a; a *= 0.5; f *= 2.03; } return s / n; }
function noise2(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return (lerp(lerp(a, b, ux), lerp(c, d, ux), uy)) * 2 - 1;
}
function fbm2(x, y, oct = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let o = 0; o < oct; o++) { s += a * noise2(x * f + o * 5.1, y * f - o * 3.7); n += a; a *= 0.5; f *= 2.02; } return s / n; }

/* ---------- colour ---------- */
function hexRGB(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function rgbStr(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function shadeHex(h, t, to = '#000000') { return rgbStr(mixRGB(hexRGB(h), hexRGB(to), t)); }
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;

/* ---------- canvas ---------- */
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
const cv = document.getElementById('tank');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, PX = 1, U = 10;
let maxPixels = window.matchMedia && matchMedia('(pointer: coarse)').matches ? 2.4e6 : 4.2e6;
let SEED = (Math.random() * 1e9) | 0;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function measure() {
  W = Math.max(320, window.innerWidth || cv.clientWidth || 800);
  H = Math.max(320, window.innerHeight || cv.clientHeight || 600);
  const dpr = window.devicePixelRatio || 1;
  PX = Math.min(dpr, Math.sqrt(maxPixels / (W * H)));
  cv.width = Math.round(W * PX); cv.height = Math.round(H * PX);
  U = Math.min(H, W * 1.15) / 100;
}

/* ---------- sprites: painted once, mip-mapped, with a fog silhouette ---------- */
const FOG_RGB = [26, 96, 134];
class Sprite {
  // paint(g, w, h) draws into a w×h canvas (sprite pixels). ox/oy = pivot as fraction.
  constructor(w, h, paint, ox = 0.5, oy = 0.5) {
    this.w = Math.ceil(w); this.h = Math.ceil(h); this.ox = ox; this.oy = oy;
    const c = mk(this.w, this.h); const g = c.getContext('2d');
    paint(g, this.w, this.h);
    this.mips = [c]; this.fogs = [];
    let cur = c;
    while (cur.width > 24 && cur.height > 12 && this.mips.length < 6) {
      const n = mk(cur.width / 2, cur.height / 2); const ng = n.getContext('2d');
      ng.imageSmoothingQuality = 'high'; ng.drawImage(cur, 0, 0, n.width, n.height);
      this.mips.push(n); cur = n;
    }
    for (const m of this.mips) {
      const f = mk(m.width, m.height); const fg = f.getContext('2d');
      fg.drawImage(m, 0, 0); fg.globalCompositeOperation = 'source-in';
      fg.fillStyle = rgbStr(FOG_RGB); fg.fillRect(0, 0, f.width, f.height);
      this.fogs.push(f);
    }
  }
  level(devW) { let k = 0; const n = this.mips.length - 1; let w = this.w; while (k < n && w * 0.5 >= devW) { w *= 0.5; k++; } return k; }
  // draw with pivot at (x, y); dw = drawn width in current units; dev = device px per unit
  draw(g, x, y, dw, dh, fog = 0, dev = PX) {
    const k = this.level(dw * dev);
    const X = x - dw * this.ox, Y = y - dh * this.oy;
    g.drawImage(this.mips[k], X, Y, dw, dh);
    if (fog > 0.015) { const a = g.globalAlpha; g.globalAlpha = a * Math.min(1, fog); g.drawImage(this.fogs[k], X, Y, dw, dh); g.globalAlpha = a; }
  }
}

/* soft round dot sprite used by particles and glows */
function makeGlow(r, stops) {
  const c = mk(r * 2, r * 2), g = c.getContext('2d');
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2); return c;
}

/* ---------- depth ---------- */
// z: 0 = against the glass, 1 = far back of the reef
const depthScale = (z) => 1 - 0.56 * z;
const depthFog = (z) => clamp(0.04 + 0.78 * Math.pow(z, 1.15), 0, 0.86);

/* ---------- time of day ---------- */
const CYCLE_SECONDS = 420;          // one full day in "Cycle" mode
const TOD = { mode: 'live', phase: 0.12, day: 1, warm: 0, night: 0, moon: 1, label: 'Midday' };
function phaseState(p) {
  // 0–.50 day, .50–.60 sunset, .60–.90 night, .90–1 sunrise
  let day, warm;
  if (p < 0.5) { day = 1; warm = 0; }
  else if (p < 0.6) { const t = (p - 0.5) / 0.1; day = 1 - smooth(t); warm = Math.sin(Math.PI * clamp(t * 1.1, 0, 1)); }
  else if (p < 0.9) { day = 0; warm = 0; }
  else { const t = (p - 0.9) / 0.1; day = smooth(t); warm = 0.7 * Math.sin(Math.PI * t); }
  return { day, warm };
}
const MODE_STATE = { day: { day: 1, warm: 0 }, dusk: { day: 0.42, warm: 1 }, night: { day: 0, warm: 0 } };
/* Live mode: approximate local sunrise/sunset from the date (mid-latitude default,
   daylight-saving aware) and the moon's phase for night brightness. */
function liveState(now = new Date()) {
  const start = new Date(now.getFullYear(), 0, 0), n = Math.floor((now - start) / 864e5);
  const lat = 36 * Math.PI / 180, dec = 23.44 * Math.PI / 180 * Math.sin(TAU * (284 + n) / 365);
  const h0 = Math.acos(clamp(-Math.tan(lat) * Math.tan(dec), -1, 1)) * 180 / Math.PI;
  const jan = new Date(now.getFullYear(), 0, 1).getTimezoneOffset(), jul = new Date(now.getFullYear(), 6, 1).getTimezoneOffset();
  const dst = now.getTimezoneOffset() < Math.max(jan, jul);
  const noon = 12 * 60 + 10 + (dst ? 60 : 0), half = h0 * 4;           // minutes
  const rise = noon - half, set = noon + half, m = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  const day = smooth((m - (rise - 25)) / 50) * (1 - smooth((m - (set - 20)) / 55));
  const warm = Math.max(Math.exp(-(((m - rise) / 28) ** 2)) * 0.7, Math.exp(-(((m - set) / 30) ** 2)));
  const moonAge = (((now - Date.UTC(2000, 0, 6, 18, 14)) / 864e5) % 29.530588 + 29.530588) % 29.530588;
  TOD.moon = 0.35 + 0.65 * (0.5 - 0.5 * Math.cos(TAU * moonAge / 29.530588));
  TOD.label = m < rise - 25 || m > set + 35 ? 'Night' : Math.abs(m - rise) < 35 ? 'Sunrise' : Math.abs(m - set) < 35 ? 'Sunset' : m < noon - 150 ? 'Morning' : m < noon + 150 ? 'Midday' : 'Afternoon';
  return { day, warm };
}
let liveT = 99, liveTarget = { day: 1, warm: 0 };
function updateTOD(dt) {
  let target;
  if (TOD.mode === 'live') { liveT += dt; if (liveT > 5) { liveT = 0; liveTarget = liveState(); } target = liveTarget; }
  else if (TOD.mode === 'cycle') { TOD.moon = 1; TOD.phase = (TOD.phase + dt / CYCLE_SECONDS) % 1; target = phaseState(TOD.phase); }
  else { TOD.moon = 1; target = MODE_STATE[TOD.mode]; }
  TOD.day = ease(TOD.day, target.day, 1.2, dt);
  TOD.warm = ease(TOD.warm, target.warm, 1.2, dt);
  TOD.night = 1 - TOD.day;
}
function todLabel() {
  if (TOD.mode === 'live') return 'Live · ' + TOD.label;
  if (TOD.mode === 'day') return 'Midday';
  if (TOD.mode === 'dusk') return 'Sunset';
  if (TOD.mode === 'night') return 'Night';
  const p = TOD.phase;
  if (p < 0.12) return 'Morning'; if (p < 0.34) return 'Midday'; if (p < 0.5) return 'Afternoon';
  if (p < 0.6) return 'Sunset'; if (p < 0.9) return 'Night'; return 'Sunrise';
}

/* ---------- performance governor ---------- */
const PERF = { ema: 16, slowFor: 0, fastFor: 0 };
function governPerf(dtMs) {
  PERF.ema = lerp(PERF.ema, dtMs, 0.05);
  if (PERF.ema > 26) { PERF.slowFor += dtMs; PERF.fastFor = 0; } else { PERF.slowFor = 0; }
  if (PERF.slowFor > 2500 && (PERF.steps || 0) < 3) {
    PERF.slowFor = 0; PERF.steps = (PERF.steps || 0) + 1;
    maxPixels = Math.max(0.8e6, Math.min(maxPixels, W * H * PX * PX) * 0.66); requestRebuild(true);
  }
}

/* =====================================================================
   Water: background, light shafts, surface, caustics, grading
   ===================================================================== */
const ENV = { bg: null, rayWarm: null, rayCool: null, rays: [], cFrames: [], cPats: [], cLayer: null, vignette: null, sunX: 0, glints: [] };

function paintBackground() {
  const c = mk(W * PX, H * PX), g = c.getContext('2d');
  g.setTransform(PX, 0, 0, PX, 0, 0);
  // water column
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0.00, '#9be6ea');
  gr.addColorStop(0.07, '#56c6dc');
  gr.addColorStop(0.26, '#2297c2');
  gr.addColorStop(0.55, '#136a9f');
  gr.addColorStop(0.82, '#0d4a7a');
  gr.addColorStop(1.00, '#0a3a63');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // sun glow from above
  const sg = g.createRadialGradient(ENV.sunX, -H * 0.15, 0, ENV.sunX, -H * 0.15, H * 1.05);
  sg.addColorStop(0, 'rgba(225,255,245,0.45)'); sg.addColorStop(0.45, 'rgba(160,235,240,0.14)'); sg.addColorStop(1, 'rgba(120,200,230,0)');
  g.fillStyle = sg; g.fillRect(0, 0, W, H);

  // distant reef ridges, farthest first
  const ridges = [
    { base: 0.60, amp: 0.10, col: [44, 128, 164], a: 0.55, f: 1.6, deco: 0.6 },
    { base: 0.68, amp: 0.11, col: [30, 104, 142], a: 0.72, f: 2.2, deco: 0.8 },
    { base: 0.76, amp: 0.09, col: [22, 84, 120], a: 0.85, f: 3.0, deco: 1.0 },
  ];
  ridges.forEach((r, li) => {
    const col = rgbStr(r.col, r.a);
    const pts = [];
    const off = srand(100);
    for (let x = -10; x <= W + 10; x += 6) {
      const u = x / W;
      const y = H * (r.base - r.amp * (0.55 + 0.45 * fbm1(u * r.f * 3 + off, 4)) - r.amp * 0.35 * Math.max(0, fbm1(u * 11 + off * 2, 3)));
      pts.push([x, y]);
    }
    g.fillStyle = col;
    g.beginPath(); g.moveTo(-10, H);
    for (const p of pts) g.lineTo(p[0], p[1]);
    g.lineTo(W + 10, H); g.closePath(); g.fill();
    // coral silhouettes along the ridge
    const n = Math.floor((W / 60) * r.deco);
    for (let i = 0; i < n; i++) {
      const p = pts[Math.floor(srand(pts.length))];
      const s = U * srand(2.2, 5.5) * (0.6 + li * 0.25);
      silhouetteCoral(g, p[0], p[1] + 2, s, col);
    }
    // a lighter rim on the ridge tops, like light catching the reef crest
    g.strokeStyle = rgbStr(mixRGB(r.col, [190, 245, 245], 0.35), 0.18 + li * 0.04);
    g.lineWidth = 1.2; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke();
    if (li === 0 && W > 640) paintWreck(g, W * srand(0.58, 0.85), H * (r.base - r.amp * 0.35), U * srand(9, 12), rgbStr(mixRGB(r.col, [14, 50, 84], 0.22), 0.7), rgbStr(mixRGB(r.col, [120, 200, 220], 0.12), 0.9));
    // haze between layers
    const hz = g.createLinearGradient(0, H * (r.base - r.amp * 1.3), 0, H);
    hz.addColorStop(0, 'rgba(40,130,170,0)'); hz.addColorStop(1, 'rgba(18,80,120,0.22)');
    g.fillStyle = hz; g.fillRect(0, H * (r.base - r.amp * 1.3), W, H);
  });
  // dither to keep the long gradients from banding
  g.setTransform(1, 0, 0, 1, 0, 0);
  const nz = mk(128, 128), ng = nz.getContext('2d'), id = ng.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() < 0.5 ? 0 : 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = Math.random() * 10; }
  ng.putImageData(id, 0, 0);
  g.fillStyle = g.createPattern(nz, 'repeat'); g.fillRect(0, 0, c.width, c.height);
  ENV.bg = c;
}

function silhouetteCoral(g, x, y, s, col) {
  g.fillStyle = col; g.strokeStyle = col; g.lineCap = 'round';
  const kind = SR();
  if (kind < 0.4) { // branching tree
    const br = (x0, y0, a, len, w, d) => {
      const x1 = x0 + Math.sin(a) * len, y1 = y0 - Math.cos(a) * len;
      g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
      if (d > 0) { br(x1, y1, a - srand(0.3, 0.7), len * 0.72, w * 0.7, d - 1); br(x1, y1, a + srand(0.3, 0.7), len * 0.72, w * 0.7, d - 1); }
    };
    br(x, y, srand(-0.2, 0.2), s * 0.9, s * 0.18, 3);
  } else if (kind < 0.7) { // fan
    g.beginPath(); g.moveTo(x, y);
    g.ellipse(x, y - s * 1.1, s * 1.1, s * 1.05, 0, Math.PI * 0.95, Math.PI * 2.05); g.closePath(); g.fill();
  } else { // boulder / brain coral
    g.beginPath(); g.ellipse(x, y, s * srand(0.8, 1.4), s * srand(0.55, 0.8), 0, Math.PI, 0); g.fill();
  }
}

function paintWreck(g, x, y, s, col, holeCol) {
  g.save(); g.translate(x, y); g.rotate(-0.09); g.fillStyle = col; g.strokeStyle = col;
  g.beginPath();
  g.moveTo(-s * 1.6, -s * 0.05); g.lineTo(-s * 1.4, -s * 0.42); g.lineTo(s * 0.9, -s * 0.46);
  g.quadraticCurveTo(s * 1.45, -s * 0.5, s * 1.75, -s * 0.78); g.lineTo(s * 1.55, s * 0.1); g.lineTo(-s * 1.6, s * 0.12); g.closePath(); g.fill();
  g.fillRect(-s * 0.9, -s * 0.66, s * 0.9, s * 0.22); // deck house
  g.lineWidth = s * 0.05; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-s * 0.2, -s * 0.5); g.lineTo(-s * 0.05, -s * 1.5); g.stroke();
  g.beginPath(); g.moveTo(s * 0.8, -s * 0.5); g.lineTo(s * 1.05, -s * 1.05); g.stroke();
  g.lineWidth = s * 0.02; g.beginPath(); g.moveTo(-s * 0.05, -s * 1.45); g.lineTo(s * 1.7, -s * 0.8); g.moveTo(-s * 0.05, -s * 1.45); g.lineTo(-s * 1.45, -s * 0.45); g.stroke();
  g.fillStyle = holeCol;
  for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(-s * 1.1 + i * s * 0.38, -s * 0.24, s * 0.05, 0, TAU); g.fill(); }
  g.beginPath(); g.ellipse(s * 0.35, -s * 0.12, s * 0.22, s * 0.14, 0.4, 0, TAU); g.fill(); // hole in the hull
  g.restore();
}

function makeRaySprite(rgb) {
  const w = 64, h = 512, c = mk(w, h), g = c.getContext('2d'), id = g.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    const v = y / h, half = 0.16 + 0.34 * v;
    const fade = Math.pow(1 - v, 1.6) * smooth(v / 0.06);
    for (let x = 0; x < w; x++) {
      const u = (x / (w - 1) - 0.5) / half;
      const a = Math.exp(-u * u * 2.6) * fade;
      const i = (y * w + x) * 4;
      id.data[i] = rgb[0]; id.data[i + 1] = rgb[1]; id.data[i + 2] = rgb[2]; id.data[i + 3] = a * 255;
    }
  }
  g.putImageData(id, 0, 0); return c;
}

function buildRays() {
  ENV.rays = [];
  const n = clamp(Math.round(W / 130), 5, 15);
  for (let i = 0; i < n; i++) {
    const x = ENV.sunX + ((i + 0.5) / n - 0.5) * W * 1.5 + rand(-40, 40);
    ENV.rays.push({ x, w: rand(0.05, 0.13) * Math.min(W, H * 1.4), len: rand(0.7, 1.05) * H, a: rand(0.25, 0.6), f: rand(0.05, 0.16), ph: rand(TAU), sway: rand(8, 26) });
  }
  ENV.glints = [];
  for (let i = 0; i < Math.round(W / 55); i++) ENV.glints.push({ x: rand(W), y: rand(0.004, 0.05) * H, s: rand(0.6, 1.6), v: rand(-14, 14), ph: rand(TAU), f: rand(0.4, 1.3) });
}

function drawRays(g, t) {
  const day = TOD.day, amt = REDUCED ? 0.6 : 1;
  const sunY = -H * 1.3;
  g.globalCompositeOperation = 'lighter';
  for (const r of ENV.rays) {
    const x = r.x + Math.sin(t * r.f * 0.7 + r.ph) * r.sway;
    const ang = Math.atan2(x - ENV.sunX, -sunY) * 0.9;
    const pulse = 0.55 + 0.45 * Math.sin(t * r.f * TAU * 0.35 + r.ph);
    const aDay = r.a * pulse * 0.42 * day * amt;
    const aNight = r.a * 0.55 * TOD.night * amt * TOD.moon;
    g.save(); g.translate(x, -H * 0.01); g.rotate(-ang);
    if (aDay > 0.005) { g.globalAlpha = aDay; g.drawImage(ENV.rayWarm, -r.w / 2, 0, r.w, r.len); }
    if (aNight > 0.005) { g.globalAlpha = aNight; g.drawImage(ENV.rayCool, -r.w / 2, 0, r.w * 0.8, r.len * 0.8); }
    g.restore();
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

function drawSurface(g, t) {
  // bright underside of the surface
  const lum = 0.35 + 0.65 * TOD.day;
  const gr = g.createLinearGradient(0, 0, 0, H * 0.1);
  gr.addColorStop(0, `rgba(235,255,252,${0.5 * lum})`); gr.addColorStop(0.35, `rgba(170,240,245,${0.16 * lum})`); gr.addColorStop(1, 'rgba(120,220,240,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H * 0.1);
  g.globalCompositeOperation = 'lighter';
  // travelling wave lines
  for (let k = 0; k < 4; k++) {
    const y0 = H * (0.012 + k * 0.011), amp = H * (0.004 + k * 0.0015), sp = 0.35 + k * 0.17;
    g.strokeStyle = `rgba(210,255,250,${(0.22 - k * 0.04) * lum})`; g.lineWidth = 1.6 - k * 0.25;
    g.beginPath();
    for (let x = 0; x <= W + 12; x += 12) {
      const y = y0 + Math.sin(x * 0.012 + t * sp * (k % 2 ? -1 : 1) * 2 + k) * amp + Math.sin(x * 0.031 - t * 1.3 + k * 2) * amp * 0.5;
      x ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  // sparkles of sun through the ripples
  for (const s of ENV.glints) {
    s.x += s.v * 0.016; if (s.x < -20) s.x = W + 20; if (s.x > W + 20) s.x = -20;
    const a = Math.max(0, Math.sin(t * s.f * 2 + s.ph)) * 0.55 * lum;
    if (a < 0.02) continue;
    g.globalAlpha = a; const w = U * 3.5 * s.s, h = U * 0.55 * s.s;
    g.drawImage(GLOW.soft, s.x - w / 2, s.y - h / 2, w, h);
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

/* ---------- caustics: tileable Worley F2–F1 frames, generated once ---------- */
function buildCausticFrames() {
  if (ENV.cFrames.length) return;
  const S = 128, F = 24, N = 15;
  const pts = [];
  for (let i = 0; i < N; i++) pts.push({ x: rand(S), y: rand(S), r: rand(5, 13), k: pick([1, -1, 1, -1, 2]), p: rand(TAU) });
  for (let f = 0; f < F; f++) {
    const th = (f / F) * TAU;
    const px = pts.map((p) => (p.x + p.r * Math.cos(p.k * th + p.p) + S) % S);
    const py = pts.map((p) => (p.y + p.r * Math.sin(p.k * th + p.p) + S) % S);
    const c = mk(S, S), g = c.getContext('2d'), id = g.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      let f1 = 1e9, f2 = 1e9;
      for (let i = 0; i < N; i++) {
        let dx = Math.abs(x - px[i]); if (dx > S / 2) dx = S - dx;
        let dy = Math.abs(y - py[i]); if (dy > S / 2) dy = S - dy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
      const e = clamp(1 - (f2 - f1) / 5.5, 0, 1);
      const v = Math.pow(e, 3) * 0.8 + Math.pow(e, 9) * 0.5 + 0.06 * Math.exp(-f1 * 0.08);
      const o = (y * S + x) * 4;
      id.data[o] = 255; id.data[o + 1] = 255; id.data[o + 2] = 235; id.data[o + 3] = clamp(v, 0, 1) * 255;
    }
    g.putImageData(id, 0, 0); ENV.cFrames.push(c);
  }
}

function drawCaustics(g, t) {
  if (!REEF.mask || !ENV.cFrames.length) return;
  const inten = 0.36 * TOD.day + 0.05 * TOD.night;
  if (inten < 0.02) return;
  const L = ENV.cLayer, lg = L.getContext('2d');
  const F = ENV.cFrames.length, ft = (t * (REDUCED ? 3 : 7)) % F, i0 = Math.floor(ft), fr = ft - i0;
  if (!ENV.cPats.length) ENV.cPats = ENV.cFrames.map((c) => lg.createPattern(c, 'repeat'));
  const sx = (U * 19) / 128 * L.scale, sy = (U * 10) / 128 * L.scale;
  const m = new DOMMatrix([sx, 0, 0, sy, (t * U * 0.8) * L.scale, 0]);
  lg.setTransform(1, 0, 0, 1, 0, 0);
  lg.globalCompositeOperation = 'copy'; lg.globalAlpha = 1 - fr;
  const pa = ENV.cPats[i0], pb = ENV.cPats[(i0 + 1) % F];
  pa.setTransform(m); lg.fillStyle = pa; lg.fillRect(0, 0, L.width, L.height);
  lg.globalCompositeOperation = 'lighter'; lg.globalAlpha = fr;
  pb.setTransform(m); lg.fillStyle = pb; lg.fillRect(0, 0, L.width, L.height);
  lg.globalAlpha = 1; lg.globalCompositeOperation = 'destination-in';
  lg.drawImage(REEF.mask, 0, 0, L.width, L.height);
  lg.globalCompositeOperation = 'source-over';
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = inten;
  g.drawImage(L, 0, REEF.bandTop, W, H - REEF.bandTop);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

/* ---------- grading and lens ---------- */
function drawGrade(g) {
  const n = TOD.night, w = TOD.warm;
  let top = mixRGB([255, 255, 255], [62, 86, 142], n), bot = mixRGB([196, 214, 232], [22, 34, 72], n);
  top = mixRGB(top, [255, 190, 150], w * 0.75); bot = mixRGB(bot, [112, 96, 150], w * 0.6);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, rgbStr(top)); gr.addColorStop(1, rgbStr(bot));
  g.globalCompositeOperation = 'multiply'; g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
}

function buildVignette() {
  const s = 0.25, c = mk(W * s, H * s), g = c.getContext('2d');
  const gr = g.createRadialGradient(c.width / 2, c.height * 0.45, Math.min(c.width, c.height) * 0.35, c.width / 2, c.height * 0.5, Math.hypot(c.width, c.height) * 0.62);
  gr.addColorStop(0, 'rgba(0,8,18,0)'); gr.addColorStop(1, 'rgba(0,8,18,0.5)');
  g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  ENV.vignette = c;
}

const GLOW = {};
function buildGlows() {
  GLOW.soft = makeGlow(32, [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.5)'], [1, 'rgba(255,255,255,0)']]);
  GLOW.cyan = makeGlow(32, [[0, 'rgba(170,255,250,1)'], [0.3, 'rgba(90,230,235,0.45)'], [1, 'rgba(40,160,220,0)']]);
  GLOW.green = makeGlow(32, [[0, 'rgba(190,255,190,1)'], [0.3, 'rgba(90,255,150,0.45)'], [1, 'rgba(30,200,120,0)']]);
  GLOW.warm = makeGlow(32, [[0, 'rgba(255,240,200,1)'], [0.35, 'rgba(255,200,120,0.4)'], [1, 'rgba(255,160,80,0)']]);
  GLOW.dot = makeGlow(8, [[0, 'rgba(255,255,255,0.95)'], [0.5, 'rgba(255,255,255,0.35)'], [1, 'rgba(255,255,255,0)']]);
  GLOW.ink = makeGlow(32, [[0, 'rgba(22,10,30,0.95)'], [0.5, 'rgba(26,14,36,0.55)'], [1, 'rgba(30,18,40,0)']]);
}

function buildEnvironment() {
  SR = mulberry32(SEED);
  ENV.sunX = W * srand(0.28, 0.62);
  paintBackground();
  if (!ENV.rayWarm) { ENV.rayWarm = makeRaySprite([255, 250, 224]); ENV.rayCool = makeRaySprite([170, 205, 255]); }
  buildRays();
  buildVignette();
  buildCausticFrames();
}

/* =====================================================================
   Reef painters: rock, coral, sponge, sand details (painted once)
   FL = fluorescence context (night glow), MK = caustic light mask
   ===================================================================== */
let FL = null, MK = null, FLA = 1;
const NEON = ['#7dff9a', '#5cf2ff', '#ff6ad5', '#ffd14a', '#9d7bff', '#ff8a3d', '#b6ff5c'];

function fluo(fn) { if (!FL) return; FL.save(); FL.globalAlpha = FLA; fn(FL); FL.restore(); }

function paintRockMass(g, x0, x1, topY, baseY, o = {}) {
  const n = Math.max(10, Math.ceil((x1 - x0) / 4)), off = srand(1000), pk = o.peak ?? 0.5;
  // a reef mound is a pile of rounded boulders: union of elliptical arcs
  const wTot = x1 - x0, hMax = baseY - topY, nb = Math.max(3, Math.round(wTot / (U * 8)));
  const boulders = [];
  for (let i = 0; i < nb; i++) {
    const u = (i + srand(0.15, 0.85)) / nb, dp = Math.abs(u - pk) / Math.max(pk, 1 - pk);
    boulders.push({ c: x0 + u * wTot, r: (wTot / nb) * srand(0.75, 1.35), h: hMax * (1 - 0.78 * Math.pow(dp, 1.25)) * srand(0.72, 1.0), p: srand(0.55, 0.9) });
  }
  for (let i = 0; i < Math.max(1, nb / 3); i++) { const b = spick(boulders); boulders.push({ c: b.c + srand(-b.r, b.r) * 0.6, r: b.r * srand(0.45, 0.7), h: b.h * srand(1.02, 1.12), p: srand(0.6, 0.9) }); }
  const prof = (x) => { let m = 0; for (const b of boulders) { const q = (x - b.c) / b.r; if (q > -1 && q < 1) m = Math.max(m, b.h * Math.pow(1 - q * q, b.p * 0.5)); } return m; };
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, x = lerp(x0, x1, u), edge = smooth(Math.min(u, 1 - u) / 0.06);
    const h = prof(x) * edge + fbm1(u * 22 + off, 3) * U * 0.9 + fbm1(u * 70 + off, 2) * U * 0.35;
    pts.push([x, baseY - Math.max(0, h)]);
  }
  o.boulders = boulders;
  const path = new Path2D(); path.moveTo(x0, baseY); pts.forEach((p) => path.lineTo(p[0], p[1]));
  path.lineTo(x1, baseY); path.quadraticCurveTo((x0 + x1) / 2, baseY + U * 1.4, x0, baseY); path.closePath();
  contactShadow(g, (x0 + x1) / 2, baseY + U * 0.4, (x1 - x0) * 0.62);
  const gr = g.createLinearGradient(0, topY, 0, baseY);
  gr.addColorStop(0, o.light ?? '#a38f98'); gr.addColorStop(0.5, o.mid ?? '#6d5d6f'); gr.addColorStop(1, o.dark ?? '#2b2638');
  g.fillStyle = gr; g.fill(path);
  g.save(); g.clip(path);
  const bw = x1 - x0, bh = baseY - topY, area = bw * bh;
  const pal = [[198, 112, 150], [132, 96, 164], [118, 136, 82], [152, 162, 168], [40, 34, 52], [214, 150, 118], [96, 150, 132]];
  for (let i = 0; i < area / (U * U * 0.9); i++) {
    const c = spick(pal), px = srand(x0, x1), py = srand(topY, baseY + U * 3);
    g.fillStyle = rgbStr(c, srand(0.08, 0.3));
    g.beginPath(); g.ellipse(px, py, U * srand(0.6, 3.2), U * srand(0.4, 1.6), srand(-0.6, 0.6), 0, TAU); g.fill();
  }
  // give each boulder its own volume: lit crown, shadowed flank
  for (const b of [...o.boulders].sort((p, q) => p.h - q.h)) {
    const cy = baseY - b.h * 0.72, gr2 = g.createRadialGradient(b.c - b.r * 0.25, cy - b.h * 0.2, b.r * 0.05, b.c, cy, b.r * 1.1);
    gr2.addColorStop(0, 'rgba(255,236,228,0.2)'); gr2.addColorStop(0.55, 'rgba(255,236,228,0.04)'); gr2.addColorStop(1, 'rgba(20,10,30,0.22)');
    g.fillStyle = gr2; g.beginPath(); g.ellipse(b.c, baseY - b.h * 0.45, b.r * 1.05, b.h * 0.62, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(18,10,28,0.13)'; g.lineWidth = srand(1.2, 2.2); g.beginPath(); g.ellipse(b.c, baseY - b.h * 0.45 + 2, b.r * 1.0, b.h * 0.6, 0, Math.PI * 0.1, Math.PI * 0.9); g.stroke();
  }
  // ledges following the silhouette
  for (let k = 1; k < 5; k++) {
    const d = (k / 5) * bh * srand(0.8, 1.1), wob = srand(100);
    g.beginPath();
    pts.forEach((p, i) => { const y = p[1] + d + fbm1(i * 0.07 + wob, 2) * U * 2.2; i ? g.lineTo(p[0], y) : g.moveTo(p[0], y); });
    g.strokeStyle = 'rgba(20,14,30,0.16)'; g.lineWidth = srand(1, 2); g.stroke();
    g.translate(0, -1.6); g.strokeStyle = 'rgba(255,235,230,0.07)'; g.lineWidth = 1; g.stroke(); g.translate(0, 1.6);
  }
  // pits and holes
  for (let i = 0; i < area / (U * U * 40); i++) {
    const px = srand(x0, x1), py = srand(topY + bh * 0.1, baseY), r = U * srand(0.2, 0.6);
    g.fillStyle = 'rgba(14,8,22,0.55)'; g.beginPath(); g.ellipse(px, py, r, r * 0.62, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,230,220,0.14)'; g.lineWidth = 1; g.beginPath(); g.ellipse(px, py + 0.8, r, r * 0.62, 0, 0.2, Math.PI - 0.2); g.stroke();
  }
  // grain
  for (let i = 0; i < area / 40; i++) { g.fillStyle = SR() < 0.5 ? 'rgba(255,240,235,0.16)' : 'rgba(10,6,16,0.2)'; g.fillRect(srand(x0, x1), srand(topY, baseY), srand(0.6, 1.6), srand(0.6, 1.6)); }
  // pink coralline crust along the crest
  for (let i = 0; i < pts.length; i += 2) {
    if (SR() > 0.45) continue;
    const [px, py] = pts[i];
    for (let k = 0; k < 4; k++) {
      g.fillStyle = spick(['rgba(226,128,162,0.8)', 'rgba(186,102,176,0.75)', 'rgba(240,170,190,0.7)']);
      g.beginPath(); g.arc(px + srand(-U, U), py + srand(0, U * 1.4), U * srand(0.15, 0.5), 0, TAU); g.fill();
    }
  }
  // ambient occlusion toward the sand
  const ao = g.createLinearGradient(0, baseY - bh * 0.35, 0, baseY + U * 2);
  ao.addColorStop(0, 'rgba(6,10,30,0)'); ao.addColorStop(1, 'rgba(6,10,30,0.55)');
  g.fillStyle = ao; g.fillRect(x0, baseY - bh * 0.35, bw, bh);
  g.restore();
  // rim light
  g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
  g.strokeStyle = 'rgba(255,244,236,0.30)'; g.lineWidth = 1.6; g.stroke();
  g.strokeStyle = 'rgba(255,244,236,0.07)'; g.lineWidth = 6; g.stroke();
  if (MK) { const mg = MK.createLinearGradient(0, topY, 0, baseY); mg.addColorStop(0, '#f0f0f0'); mg.addColorStop(0.5, '#707070'); mg.addColorStop(1, '#1c1c1c'); MK.fillStyle = mg; MK.fill(path); }
  const topAt = (x) => { const u = clamp((x - x0) / (x1 - x0), 0, 1) * n, i = Math.floor(u), f = u - i; const a = pts[Math.min(i, n)], b = pts[Math.min(i + 1, n)]; return lerp(a[1], b[1], f); };
  return { pts, topAt, x0, x1, path };
}

function contactShadow(g, x, y, rx) {
  const gr = g.createRadialGradient(x, y, 0, x, y, rx);
  gr.addColorStop(0, 'rgba(8,6,20,0.45)'); gr.addColorStop(1, 'rgba(8,6,20,0)');
  g.save(); g.scale(1, 0.3); g.fillStyle = gr; g.beginPath(); g.arc(x, y / 0.3, rx, 0, TAU); g.fill(); g.restore();
}

function brainCoral(g, x, y, r, col) {
  col = col ?? spick(['#c8ae76', '#9db36a', '#d8a66a', '#b9b08a', '#88a98f']);
  const ry = r * 0.7;
  contactShadow(g, x, y + 1, r * 1.2);
  const p = new Path2D(); p.ellipse(x, y, r, ry, 0, Math.PI, TAU); p.lineTo(x - r, y); p.closePath();
  const gr = g.createRadialGradient(x - r * 0.3, y - ry * 0.8, r * 0.1, x, y - ry * 0.3, r * 1.1);
  gr.addColorStop(0, shadeHex(col, 0.35, '#fff8e8')); gr.addColorStop(0.6, col); gr.addColorStop(1, shadeHex(col, 0.55));
  g.fillStyle = gr; g.fill(p);

  const dark = shadeHex(col, 0.62), light = shadeHex(col, 0.45, '#ffffff');
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {

    for (let k = 0; k < 9; k++) { const a = noise2(px * f * 0.35 + 7, py * f * 0.35) * TAU * 1.2; px += Math.cos(a) * r * 0.06; py += Math.sin(a) * r * 0.06; seg.push([px, py]); }
    g.beginPath(); seg.forEach((s, j) => (j ? g.lineTo(s[0], s[1]) : g.moveTo(s[0], s[1])));
    g.strokeStyle = dark; g.globalAlpha = 0.55; g.lineWidth = Math.max(1, r * 0.035); g.stroke();
    g.translate(-0.7, -0.7); g.strokeStyle = light; g.globalAlpha = 0.28; g.lineWidth = Math.max(0.7, r * 0.02); g.stroke(); g.translate(0.7, 0.7);
  }
  g.globalAlpha = 1;
  const eg = g.createRadialGradient(x, y - ry * 0.4, r * 0.5, x, y - ry * 0.2, r * 1.05);
  eg.addColorStop(0, 'rgba(10,8,20,0)'); eg.addColorStop(1, 'rgba(10,8,20,0.45)');
  g.fillStyle = eg; g.fillRect(x - r, y - ry, r * 2, ry);
  g.restore();
  // christmas tree worms
  for (let i = 0; i < randi(1, 3); i++) {
    const a = srand(Math.PI * 1.15, Math.PI * 1.85), wx = x + Math.cos(a) * r * 0.8, wy = y + Math.sin(a) * ry * 0.8;
    const c = spick(['#ff4d4d', '#3aa0ff', '#ffd23a', '#ffffff', '#ff8a2a']);

  }
  if (MK) { MK.fillStyle = '#d0d0d0'; MK.fill(p); }
  fluo((F) => { F.strokeStyle = spick(['#7dff9a', '#b6ff5c', '#5cf2ff']); F.globalAlpha = 0.35 * FLA; F.lineWidth = r * 0.06; F.beginPath(); F.ellipse(x, y, r * 0.9, ry * 0.85, 0, Math.PI, TAU); F.stroke(); });
}

function christmasWorm(g, x, y, s, c) {
  g.fillStyle = c;
  for (let k = 0; k < 4; k++) { const w = s * (1 - k * 0.2), yy = y - k * s * 0.45; g.beginPath(); g.moveTo(x - w * 0.5, yy); g.lineTo(x + w * 0.5, yy); g.lineTo(x, yy - s * 0.55); g.closePath(); g.fill(); }
}

function branchingCoral(g, x, y, s) {
  const pal = spick([
    ['#b98f6c', '#f0d6b8', '#b6ff5c'], ['#8c6cc6', '#e6d2ff', '#ff6ad5'], ['#6f95d6', '#c9f2ff', '#5cf2ff'],
    ['#c47b86', '#ffd0d8', '#ff6ad5'], ['#9aa36c', '#e9f2b0', '#7dff9a'],
  ]);
  const [base, tip, neon] = pal, bRGB = hexRGB(base), tRGB = hexRGB(tip);
  const segs = [];
  const br = (x0, y0, a, len, w, d) => {
    const bend = srand(-0.25, 0.25), x1 = x0 + Math.sin(a) * len, y1 = y0 - Math.cos(a) * len;
    const cx = (x0 + x1) / 2 + Math.cos(a) * len * bend, cy = (y0 + y1) / 2 + Math.sin(a) * len * bend;
    segs.push({ x0, y0, cx, cy, x1, y1, w, d });
    if (d > 0) {
      const kids = SR() < 0.35 ? 3 : 2;
      for (let k = 0; k < kids; k++) br(x1, y1, a + srand(-0.75, 0.75) * (k === 0 ? 0.4 : 1), len * srand(0.62, 0.82), w * 0.72, d - 1);
    }
  };
  const trunks = randi(2, 4);
  for (let t = 0; t < trunks; t++) br(x + srand(-s * 0.5, s * 0.5), y + 2, srand(-0.6, 0.6), s * srand(0.8, 1.2), s * 0.26, 3);
  contactShadow(g, x, y + 1, s * 1.4);
  g.lineCap = 'round';
  const maxD = 3;
  for (const pass of [0, 1, 2]) for (const sg of segs) {
    const t = 1 - sg.d / maxD;
    g.beginPath(); g.moveTo(sg.x0, sg.y0); g.quadraticCurveTo(sg.cx, sg.cy, sg.x1, sg.y1);
    if (pass === 0) { g.strokeStyle = rgbStr(mixRGB(bRGB, [20, 10, 30], 0.55)); g.lineWidth = sg.w + 2; }
    else if (pass === 1) { g.strokeStyle = rgbStr(mixRGB(bRGB, tRGB, t * 0.85)); g.lineWidth = sg.w; }
    else { g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = Math.max(0.6, sg.w * 0.28); g.translate(-sg.w * 0.2, 0); }
    g.stroke(); if (pass === 2) g.translate(sg.w * 0.2, 0);
  }
  for (const sg of segs) {
    for (let k = 1; k < 4; k++) { const u = k / 4; g.fillStyle = 'rgba(255,250,240,0.35)'; g.beginPath(); g.arc(lerp(sg.x0, sg.x1, u) + srand(-1, 1), lerp(sg.y0, sg.y1, u), Math.max(0.6, sg.w * 0.16), 0, TAU); g.fill(); }
    if (sg.d === 0) {
      g.fillStyle = tip; g.beginPath(); g.arc(sg.x1, sg.y1, sg.w * 0.62, 0, TAU); g.fill();
      fluo((F) => { F.fillStyle = neon; F.beginPath(); F.arc(sg.x1, sg.y1, sg.w * 0.9, 0, TAU); F.fill(); });
    }
  }
}

function seaFan(g, x, y, s, col) {
  col = col ?? spick(['#9b45c4', '#d0425c', '#e7b23c', '#e26a3a', '#c24aa0']);
  const R = s * srand(2.4, 3.4), lean = srand(-0.25, 0.25);
  g.save(); g.translate(x, y); g.rotate(lean);
  const out = new Path2D(); out.moveTo(0, 0);
  out.bezierCurveTo(-R * 0.9, -R * 0.2, -R * 1.05, -R * 1.1, -R * 0.2, -R * 1.2);
  out.bezierCurveTo(R * 0.5, -R * 1.3, R * 1.1, -R * 0.9, R * 0.85, -R * 0.2); out.closePath();
  g.save(); g.clip(out);
  g.strokeStyle = col; g.lineCap = 'round';
  for (let i = 0; i < 34; i++) {
    const a = lerp(-1.15, 1.15, i / 33) + srand(-0.03, 0.03);
    g.globalAlpha = 0.75; g.lineWidth = srand(0.7, 1.3); g.beginPath(); g.moveTo(0, 0);
    g.quadraticCurveTo(Math.sin(a) * R * 0.6 + srand(-5, 5), -Math.cos(a) * R * 0.6, Math.sin(a) * R * 1.4, -Math.cos(a) * R * 1.4); g.stroke();
  }
  for (let k = 1; k < 16; k++) {
    const rr = (k / 16) * R * 1.3; g.globalAlpha = 0.55; g.lineWidth = 0.8; g.beginPath();
    for (let a = -1.3; a <= 1.3; a += 0.08) { const wob = 1 + fbm1(a * 6 + k * 3.1, 2) * 0.05; const px = Math.sin(a) * rr * wob, py = -Math.cos(a) * rr * wob; a <= -1.29 ? g.moveTo(px, py) : g.lineTo(px, py); }
    g.stroke();
  }
  g.restore();
  g.globalAlpha = 1; g.strokeStyle = shadeHex(col, 0.3); g.lineCap = 'round';
  for (let i = 0; i < 5; i++) { const a = lerp(-0.8, 0.8, i / 4); g.lineWidth = s * 0.16; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(Math.sin(a) * R * 0.3, -R * 0.45, Math.sin(a) * R * 0.75, -Math.cos(a) * R * 0.95); g.stroke(); }
  g.restore();
}

function tubeSponge(g, x, y, s) {
  const col = spick(['#e8762e', '#8a4fc2', '#e0c23a', '#d9445c', '#4f7fd6', '#e05a8a']);
  const n = randi(2, 5);
  contactShadow(g, x, y + 1, s * 1.3);
  const tubes = [];
  for (let i = 0; i < n; i++) tubes.push({ dx: (i - (n - 1) / 2) * s * 0.55 + srand(-3, 3), w: s * srand(0.42, 0.66), h: s * srand(1.6, 3.6), a: srand(-0.22, 0.22) });
  tubes.sort((a, b) => b.h - a.h);
  for (const t of tubes) {
    g.save(); g.translate(x + t.dx, y + 2); g.rotate(t.a);
    const w = t.w, h = t.h;
    const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0);
    gr.addColorStop(0, shadeHex(col, 0.55)); gr.addColorStop(0.4, shadeHex(col, 0.18, '#ffffff')); gr.addColorStop(1, shadeHex(col, 0.45));
    g.fillStyle = gr;

    g.fillStyle = 'rgba(20,10,20,0.25)';
    for (let k = 0; k < h * w / 18; k++) g.fillRect(srand(-w * 0.45, w * 0.45), -srand(0, h), 1.1, 1.1);
    const ig = g.createLinearGradient(0, -h - w * 0.2, 0, -h + w * 0.2); ig.addColorStop(0, '#1a0c14'); ig.addColorStop(1, shadeHex(col, 0.7));
    g.fillStyle = shadeHex(col, 0.1, '#ffffff'); g.beginPath(); g.ellipse(0, -h, w * 0.6, w * 0.2, 0, 0, TAU); g.fill();
    g.fillStyle = ig; g.beginPath(); g.ellipse(0, -h + 1, w * 0.46, w * 0.13, 0, 0, TAU); g.fill();
    g.restore();
  }
}

function treeCoral(g, x, y, s) {

    g.strokeStyle = 'rgba(255,235,240,0.55)'; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();

function giantClam(g, x, y, s) {
  const mantle = spick([['#1fb6ff', '#0b3d91'], ['#2ee6b8', '#10566b'], ['#9b5cff', '#24125e'], ['#3dd66b', '#114a3a']]);

  g.fillStyle = '#cfc6b4'; g.beginPath(); g.ellipse(x, y - s * 0.1, w, s * 0.55, 0, 0, Math.PI); g.lineTo(x - w, y - s * 0.1); g.fill();
  g.strokeStyle = 'rgba(80,70,60,0.5)'; g.lineWidth = 1;
  for (let i = 1; i < 6; i++) { const px = x - w + (i / 6) * w * 2; g.beginPath(); g.moveTo(px, y - s * 0.1); g.quadraticCurveTo(px + (px - x) * 0.1, y + s * 0.2, px + (px - x) * 0.15, y + s * 0.4); g.stroke(); }
  const mp = new Path2D(); mp.moveTo(x - w * 0.95, y - s * 0.1);
  for (let i = 0; i <= 16; i++) { const u = i / 16, px = x - w * 0.95 + u * w * 1.9, py = y - s * 0.1 - s * (0.35 + 0.12 * Math.sin(u * TAU * 3)) * Math.sin(Math.PI * u); mp.lineTo(px, py); }
  mp.closePath();
  const gr = g.createLinearGradient(0, y - s * 0.55, 0, y); gr.addColorStop(0, mantle[0]); gr.addColorStop(1, mantle[1]);
  g.fillStyle = gr; g.fill(mp);
  g.save(); g.clip(mp); g.fillStyle = 'rgba(210,255,255,0.55)';
  for (let i = 0; i < 26; i++) { g.beginPath(); g.arc(x + srand(-w, w), y - srand(0, s * 0.5), srand(0.6, 1.8), 0, TAU); g.fill(); }
  g.restore();
  g.strokeStyle = 'rgba(230,255,255,0.6)'; g.lineWidth = 1.2; g.stroke(mp);
  fluo((F) => { F.strokeStyle = mantle[0]; F.lineWidth = s * 0.2; F.stroke(mp); });
}

function starfish(g, x, y, s, col, flat = 0.5) {
  col = col ?? spick(['#e2453a', '#f08a2c', '#3a6fd8', '#b8335a', '#e8b23a']);
  const rot = srand(TAU);
  g.save(); g.translate(x, y); g.scale(1, flat); g.rotate(rot);
  const p = new Path2D();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU, r = i % 2 ? s * 0.34 : s * srand(0.95, 1.1);
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    if (!i) p.moveTo(px, py); else { const a0 = ((i - 0.5) / 10) * TAU, rc = s * 0.52; p.quadraticCurveTo(Math.cos(a0) * rc, Math.sin(a0) * rc, px, py); }
  }
  p.closePath();
  g.fillStyle = 'rgba(10,6,20,0.3)'; g.translate(1.5, 2.5); g.fill(p); g.translate(-1.5, -2.5);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, s); gr.addColorStop(0, shadeHex(col, 0.3, '#ffffff')); gr.addColorStop(1, shadeHex(col, 0.3));
  g.fillStyle = gr; g.fill(p);
  g.fillStyle = 'rgba(255,245,230,0.55)';
  for (let k = 0; k < 5; k++) { const a = (k / 5) * TAU; for (let j = 1; j < 6; j++) { g.beginPath(); g.arc(Math.cos(a) * s * j * 0.16, Math.sin(a) * s * j * 0.16, s * 0.045, 0, TAU); g.fill(); } }
  g.restore();
}

function urchin(g, x, y, s) {
  g.save(); g.translate(x, y - s * 0.35);
  g.strokeStyle = '#1b1024'; g.lineCap = 'round';
  for (let i = 0; i < 44; i++) { const a = srand(Math.PI * 0.95, Math.PI * 2.05), l = s * srand(1.1, 2.1); g.lineWidth = srand(0.8, 1.6); g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * l, Math.sin(a) * l * 0.9); g.stroke(); }
  const gr = g.createRadialGradient(-s * 0.15, -s * 0.2, 0, 0, 0, s * 0.55); gr.addColorStop(0, '#5a3a6a'); gr.addColorStop(1, '#160c1e');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, s * 0.55, 0, TAU); g.fill();
  g.restore();
}

function seaWhip(g, x, y, s) {
  const col = spick(['#e0442e', '#f0a23a', '#e8d23a', '#c43a8a']);
  g.lineCap = 'round';
  for (let i = 0; i < randi(2, 4); i++) {
    const h = s * srand(3, 6), a = srand(-0.35, 0.35), bend = srand(-0.6, 0.6);
    g.strokeStyle = shadeHex(col, 0.35); g.lineWidth = s * 0.16 + 1.5;
    const path = () => { g.beginPath(); g.moveTo(x, y + 2); g.quadraticCurveTo(x + Math.sin(a) * h * 0.5 + bend * s, y - h * 0.5, x + Math.sin(a) * h, y - Math.cos(a) * h); };
    path(); g.stroke(); g.strokeStyle = col; g.lineWidth = s * 0.16; path(); g.stroke();
  }
}

function shell(g, x, y, s) {
  const k = SR();
  g.save(); g.translate(x, y);
  if (k < 0.35) { // conch
    g.rotate(srand(-0.4, 0.4));
    const gr = g.createLinearGradient(-s, 0, s, 0); gr.addColorStop(0, '#f3dcc2'); gr.addColorStop(1, '#d69a74');
    g.fillStyle = gr; g.beginPath(); g.moveTo(-s, 0); g.quadraticCurveTo(-s * 0.2, -s * 0.9, s * 0.9, -s * 0.2); g.quadraticCurveTo(s * 0.2, s * 0.35, -s, 0); g.fill();
    g.strokeStyle = 'rgba(120,70,50,0.5)'; g.lineWidth = 0.8;
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(-s + i * s * 0.45, -s * 0.5 + i * 0.1); g.lineTo(-s + i * s * 0.45 + s * 0.15, s * 0.08); g.stroke(); }
    g.fillStyle = '#ffd9e0'; g.beginPath(); g.ellipse(s * 0.1, -s * 0.05, s * 0.35, s * 0.12, -0.3, 0, TAU); g.fill();
  } else if (k < 0.6) { // cowrie
    const gr = g.createRadialGradient(-s * 0.2, -s * 0.3, 0, 0, 0, s); gr.addColorStop(0, '#fff6ea'); gr.addColorStop(0.5, '#c9905c'); gr.addColorStop(1, '#6e4630');
    g.fillStyle = gr; g.beginPath(); g.ellipse(0, -s * 0.2, s * 0.7, s * 0.4, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.7)'; for (let i = 0; i < 8; i++) { g.beginPath(); g.arc(srand(-s * 0.5, s * 0.5), -s * srand(0.1, 0.45), s * 0.05, 0, TAU); g.fill(); }
  } else if (k < 0.8) { // sand dollar
    g.scale(1, 0.4); g.fillStyle = '#e9dcc0'; g.beginPath(); g.arc(0, 0, s * 0.8, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(140,120,90,0.6)'; g.lineWidth = 1.5;
    for (let i = 0; i < 5; i++) { const a = (i / 5) * TAU - Math.PI / 2; g.beginPath(); g.ellipse(Math.cos(a) * s * 0.35, Math.sin(a) * s * 0.35, s * 0.3, s * 0.1, a, 0, TAU); g.stroke(); }
  } else { // rubble
    g.strokeStyle = '#efe6dc'; g.lineCap = 'round';
    for (let i = 0; i < 3; i++) { g.lineWidth = s * srand(0.15, 0.3); g.beginPath(); const a = srand(TAU); g.moveTo(-Math.cos(a) * s * 0.6, -Math.abs(Math.sin(a)) * s * 0.2); g.lineTo(Math.cos(a) * s * 0.6, 0); g.stroke(); }
  }
  g.restore();
}

/* =====================================================================
   Reef layout: layers (back, front, foreground), fluorescence, caustic
   mask, heightmap and anchor points for the animated life
   ===================================================================== */
const REEF = { back: null, front: null, fg: null, fluo: null, mask: null, bandTop: 0, top: null, step: 6, sand: null, rocks: [],
  anemone: null, cave: null, vent: null, chest: null, eelBed: null, grass: [], urchins: [] };

function sandY(x) { const a = REEF.sand; return a[clamp(Math.round(x / 4), 0, a.length - 1)]; }
function reefTopAt(x) { const t = REEF.top; if (!t) return H * 0.85; return t[clamp(Math.round(x / REEF.step), 0, t.length - 1)]; }

function layerCanvas(scale) {
  const c = mk(W * PX * scale, (H - REEF.bandTop) * PX * scale), g = c.getContext('2d');
  g.setTransform(PX * scale, 0, 0, PX * scale, 0, -REEF.bandTop * PX * scale);
  return [c, g];
}

function paintSand(g, mg) {
  const top = H * 0.84;
  const p = new Path2D(); p.moveTo(-5, H + 5);
  for (let x = -4; x <= W + 4; x += 4) p.lineTo(x, sandY(x));
  p.lineTo(W + 5, H + 5); p.closePath();
  const gr = g.createLinearGradient(0, top, 0, H);
  gr.addColorStop(0, '#d9c59a'); gr.addColorStop(0.35, '#cfb487'); gr.addColorStop(1, '#a18763');
  g.fillStyle = gr; g.fill(p);
  g.save(); g.clip(p);
  const hz = g.createLinearGradient(0, top, 0, top + H * 0.07);
  hz.addColorStop(0, rgbStr(FOG_RGB, 0.6)); hz.addColorStop(1, rgbStr(FOG_RGB, 0));
  g.fillStyle = hz; g.fillRect(0, top - 10, W, H * 0.09);
  let y = top + 2;
  while (y < H + 4) {
    const t = clamp((y - top) / (H - top), 0, 1), sp = lerp(U * 0.3, U * 1.5, t), wl = W / srand(7, 13), ph = srand(TAU);
    const path = (dy) => { g.beginPath(); for (let x = -8; x <= W + 8; x += 8) { const yy = y + dy + Math.sin(x / wl * TAU + ph) * sp * 0.35 + fbm1(x * 0.01 + ph, 2) * sp * 0.4; x > -8 ? g.lineTo(x, yy) : g.moveTo(x, yy); } };
    path(0); g.strokeStyle = `rgba(255,248,225,${0.12 + t * 0.1})`; g.lineWidth = sp * 0.22; g.stroke();
    path(sp * 0.22); g.strokeStyle = `rgba(90,66,40,${0.08 + t * 0.1})`; g.lineWidth = sp * 0.16; g.stroke();
    y += sp * srand(0.8, 1.2);
  }
  const n = (W * (H - top)) / 26;
  for (let i = 0; i < n; i++) {
    const r = SR();
    g.fillStyle = r < 0.45 ? 'rgba(255,250,235,0.45)' : r < 0.85 ? 'rgba(80,60,40,0.3)' : spick(['rgba(240,150,170,0.55)', 'rgba(170,190,210,0.5)', 'rgba(255,255,255,0.7)']);
    const yy = srand(top, H), s = lerp(0.6, 2.0, (yy - top) / (H - top)) * srand(0.6, 1.3);
    g.fillRect(srand(W), yy, s, s);
  }
  g.restore();
  const m = mg.createLinearGradient(0, top, 0, H); m.addColorStop(0, '#dddddd'); m.addColorStop(1, '#8a8a8a');
  mg.fillStyle = m; mg.fill(p);
}

function decorateRock(g, r, baseY, dens = 1, reserve = []) {
  const n = Math.floor(((r.x1 - r.x0) / (U * 2.5)) * dens), items = [];
  for (let i = 0; i < n; i++) {
    const x = srand(Math.max(r.x0 + U, U), Math.min(r.x1 - U, W - U)), top = r.topAt(x);
    const crest = SR() < 0.58, y = crest ? top + U * 0.5 : lerp(top, baseY, srand(0.18, 0.72));
    if (reserve.some((q) => Math.abs(q.x - x) < q.r * 1.3 && Math.abs(q.y - y) < q.r * 1.3)) continue;
    items.push({ x, y, k: SR(), crest });
  }
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    const s = U * srand(1.2, 2.3), k = it.k;
    if (k < 0.15) brainCoral(g, it.x, it.y, s * 1.25);
    else if (k < 0.35) branchingCoral(g, it.x, it.y, s);
    else if (k < 0.44) (it.crest && SR() < 0.45 ? tableCoral : branchingCoral)(g, it.x, it.y, s * 0.9);
    else if (k < 0.54) (it.crest ? seaFan : zoanthids)(g, it.x, it.y, s * 0.9);
    else if (k < 0.64) tubeSponge(g, it.x, it.y, s * 0.85);
    else if (k < 0.75) zoanthids(g, it.x, it.y, s);
    else if (k < 0.83) treeCoral(g, it.x, it.y, s * 0.85);
    else if (k < 0.89) bubbleCoral(g, it.x, it.y, s * 0.85);
    else if (k < 0.95) giantClam(g, it.x, it.y, s * 0.8);
    else seaWhip(g, it.x, it.y, s * 0.8);
  }
}

function paintCave(g, x, y, r) {
  const gr = g.createRadialGradient(x, y + r * 0.25, r * 0.1, x, y, r * 1.25);
  gr.addColorStop(0, '#030108'); gr.addColorStop(0.62, '#0c0612'); gr.addColorStop(1, 'rgba(24,14,34,0)');
  g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r * 1.35, r * 0.95, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,228,220,0.2)'; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y + 1, r * 1.12, r * 0.74, 0, Math.PI * 1.08, Math.PI * 1.92); g.stroke();
  if (MK) { MK.fillStyle = '#000'; MK.beginPath(); MK.ellipse(x, y, r * 1.1, r * 0.75, 0, 0, TAU); MK.fill(); }
}

function paintForeground(g) {
  const tmp = mk(W * PX, (H - REEF.bandTop) * PX), tg = tmp.getContext('2d');
  tg.setTransform(PX, 0, 0, PX, 0, -REEF.bandTop * PX);
  const saveFL = FL, saveMK = MK; FL = null; MK = null;
  const L = paintRockMass(tg, -W * 0.08, W * (W < H ? 0.3 : 0.15), H * 0.83, H * 1.02, { light: '#5a4c5e', mid: '#352c40', dark: '#150f1e', peak: 0.3, round: 0.8 });
  const R = paintRockMass(tg, W * (W < H ? 0.72 : 0.88), W * 1.07, H * 0.8, H * 1.02, { light: '#5a4c5e', mid: '#352c40', dark: '#150f1e', peak: 0.7, round: 0.8 });
  for (const r of [L, R]) for (let i = 0; i < 3; i++) { const x = srand(Math.max(r.x0 + U * 2, U), Math.min(r.x1 - U * 2, W - U)); (SR() < 0.5 ? branchingCoral : seaFan)(tg, x, r.topAt(x) + U * 0.3, U * srand(1.6, 2.4)); }
  tg.setTransform(1, 0, 0, 1, 0, 0); tg.globalCompositeOperation = 'source-atop';
  tg.fillStyle = 'rgba(6,16,30,0.5)'; tg.fillRect(0, 0, tmp.width, tmp.height);
  FL = saveFL; MK = saveMK;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  if ('filter' in g) g.filter = `blur(${Math.max(1, 1.6 * PX)}px)`;
  g.drawImage(tmp, 0, 0); g.restore();
}

function buildReef() {
  SR = mulberry32(SEED ^ 0x5eed);
  REEF.bandTop = Math.floor(H * 0.34);
  const o = srand(100);
  REEF.sand = new Float32Array(Math.ceil(W / 4) + 3);
  for (let i = 0; i < REEF.sand.length; i++) { const x = i * 4; REEF.sand[i] = H * (0.868 + 0.014 * fbm1((x / W) * 2.2 + o, 3) + 0.006 * Math.sin((x / W) * 8 + o)); }

  const [back, bg] = layerCanvas(1), [front, fg] = layerCanvas(1), [fore, fog] = layerCanvas(1);
  const [fl, flg] = layerCanvas(0.5), [mask, mg] = layerCanvas(0.25);
  mg.fillStyle = '#000'; mg.fillRect(-10, REEF.bandTop - 10, W + 20, H);
  MK = mg; FL = flg;

  /* back reef — farther formations, fogged */
  FLA = 0.35;
  const nb = Math.max(2, Math.round(W / 420));
  for (let i = 0; i < nb; i++) {
    const cx = ((i + 0.5) / nb) * W + srand(-W * 0.06, W * 0.06), w = W * srand(0.3, 0.46) / Math.max(1, nb * 0.45);
    const base = sandY(cx) + H * 0.012, top = H * (W / H < 0.9 ? srand(0.64, 0.72) : srand(0.5, 0.62));
    const r = paintRockMass(bg, cx - w / 2, cx + w / 2, top, base, { light: '#948da2', mid: '#5f5874', dark: '#2e2b44', peak: srand(0.3, 0.7), round: srand(0.5, 0.9), freq: srand(2, 4) });
    decorateRock(bg, r, base, 1.0);
  }
  bg.save(); bg.globalCompositeOperation = 'source-atop'; bg.fillStyle = rgbStr(FOG_RGB, 0.44); bg.fillRect(-10, REEF.bandTop - 10, W + 20, H); bg.restore();

  /* front reef */
  FLA = 1;
  paintSand(fg, mg);
  const narrow = W / H < 0.9;
  const spec = narrow
    ? [{ x0: -0.14, x1: 0.46, top: 0.71, base: 0.975, peak: 0.45 }, { x0: 0.58, x1: 1.14, top: 0.73, base: 0.98, peak: 0.55 }]
    : [{ x0: -0.04, x1: 0.34, top: 0.56, base: 0.972, peak: 0.36 }, { x0: 0.415, x1: 0.595, top: 0.748, base: 0.93, peak: 0.5, round: 0.95 }, { x0: 0.705, x1: 1.05, top: 0.585, base: 0.978, peak: 0.62 }];
  REEF.rocks = [];
  for (const s of spec) {
    const r = paintRockMass(fg, W * s.x0, W * s.x1, H * s.top, H * s.base, { peak: s.peak, round: s.round ?? 0.6, freq: 3.2 });
    r.base = H * s.base; REEF.rocks.push(r);
  }
  // anchors
  const L = REEF.rocks[0], C = narrow ? REEF.rocks[1] : REEF.rocks[1], Rr = REEF.rocks[REEF.rocks.length - 1];
  const ax = narrow ? lerp(C.x0, C.x1, 0.42) : (C.x0 + C.x1) / 2;
  REEF.anemone = { x: ax, y: C.topAt(ax) + U * 0.6 };
  const cx = lerp(Math.max(L.x0, 0), L.x1, narrow ? 0.4 : 0.52), cy = lerp(L.topAt(cx), L.base, 0.42);
  REEF.cave = { x: cx, y: cy, r: U * 3.2 };
  const vx = lerp(Rr.x0, Math.min(Rr.x1, W), 0.35); REEF.vent = { x: vx, y: Rr.topAt(vx) + U * 0.5 };
  const reserve = [{ x: REEF.anemone.x, y: REEF.anemone.y, r: U * 5 }, { x: cx, y: cy, r: U * 4.2 }, { x: vx, y: REEF.vent.y, r: U * 1.5 }];
  paintCave(fg, cx, cy, REEF.cave.r);
  for (const r of REEF.rocks) decorateRock(fg, r, r.base, 1.75, reserve);

  // open sand: eel bed, chest, grass, details
  const gap = narrow ? [0.44, 0.6] : [0.6, 0.705];
  REEF.eelBed = { x0: W * (gap[0] + 0.012), x1: W * (gap[1] - 0.012) };
  const chx = narrow ? W * 0.52 : W * 0.375;
  REEF.chest = { x: chx, y: H * 0.955 };
  REEF.grass = [];
  const grassSpots = narrow ? [[0.45, 0.93], [0.05, 0.995], [0.95, 0.99]] : [[0.345, 0.915], [0.395, 0.9], [0.405, 0.935], [0.6, 0.93], [0.03, 0.995], [0.97, 0.99], [0.68, 0.965]];
  for (const [gx, gy] of grassSpots) REEF.grass.push({ x: W * gx, y: H * gy, n: randi(5, 9), h: U * rand(5, 10) * (gy > 0.97 ? 1.6 : 1) });
  const onRock = (x, y) => REEF.rocks.some((r) => x > r.x0 && x < r.x1 && y < r.base + U * 0.8 && y > r.topAt(x) - U);
  for (let i = 0; i < W / 70; i++) { const x = srand(W), y = srand(sandY(x) + U, H - U * 0.5); if (!onRock(x, y)) shell(fg, x, y, U * srand(0.5, 1.0) * lerp(0.6, 1.3, (y - H * 0.85) / (H * 0.15))); }
  for (let i = 0; i < randi(2, 4); i++) { const x = srand(W * 0.05, W * 0.95), y = srand(sandY(x) + U * 2, H - U * 2); if (!onRock(x, y) && Math.abs(x - chx) > U * 6) starfish(fg, x, y, U * srand(1.2, 1.9)); }
  for (const r of REEF.rocks) { const x = srand(r.x0 + U * 3, r.x1 - U * 3), y = lerp(r.topAt(x), r.base, 0.55); if (x > 0 && x < W) starfish(fg, x, y, U * srand(1.0, 1.5), null, 0.85); }
  for (const r of REEF.rocks) for (let i = 0; i < randi(1, 3); i++) { const x = clamp(r.x0 + srand(r.x1 - r.x0), U, W - U); urchin(fg, x, r.base + U * srand(0.2, 1.2), U * srand(0.8, 1.2)); }

  /* foreground corners */
  paintForeground(fog);

  /* caustic mask: grey level → alpha */
  const mctx = mask.getContext('2d'), md = mctx.getImageData(0, 0, mask.width, mask.height);
  for (let i = 0; i < md.data.length; i += 4) { const v = md.data[i]; md.data[i] = md.data[i + 1] = md.data[i + 2] = 255; md.data[i + 3] = v; }
  mctx.putImageData(md, 0, 0);

  /* heightmap of the reef silhouette for swimmers */
  const st = REEF.step, cols = Math.ceil(W / st) + 1, rows = Math.ceil((H - REEF.bandTop) / st);
  const hm = mk(cols, rows), hg = hm.getContext('2d');
  hg.drawImage(back, 0, 0, cols, rows); hg.drawImage(front, 0, 0, cols, rows);
  const hd = hg.getImageData(0, 0, cols, rows).data;
  REEF.top = new Float32Array(cols);
  for (let c = 0; c < cols; c++) { let r = 0; while (r < rows && hd[(r * cols + c) * 4 + 3] < 140) r++; REEF.top[c] = REEF.bandTop + r * st; }

  REEF.back = back; REEF.front = front; REEF.fg = fore; REEF.fluo = fl; REEF.mask = mask;
  const cl = mk(W * PX * 0.38, (H - REEF.bandTop) * PX * 0.38); cl.scale = PX * 0.38; ENV.cLayer = cl; ENV.cPats = [];
  FL = null; MK = null;
}

/* =====================================================================
   Reef life: anemone, seagrass, garden eels, chest, bubbles, snow,
   food, bioluminescent sparks, jellyfish
   ===================================================================== */
const LIFE = { anemone: null, grass: [], eels: [], chest: null, bubbles: [], snow: [], food: [], sparks: [], jellies: [], ventT: 0, danger: [] };
let BUBBLE = null;

function buildBubbleSprite() {
  const r = 32, c = mk(r * 2, r * 2), g = c.getContext('2d');
  const gr = g.createRadialGradient(r, r, r * 0.55, r, r, r);
  gr.addColorStop(0, 'rgba(200,245,255,0.05)'); gr.addColorStop(0.8, 'rgba(210,250,255,0.35)'); gr.addColorStop(0.95, 'rgba(240,255,255,0.9)'); gr.addColorStop(1, 'rgba(240,255,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(r, r, r, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.95)'; g.beginPath(); g.ellipse(r * 0.68, r * 0.62, r * 0.2, r * 0.12, -0.7, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.45)'; g.beginPath(); g.arc(r * 1.3, r * 1.35, r * 0.08, 0, TAU); g.fill();
  BUBBLE = c;
}

/* ---------- anemone (bubble-tip) ---------- */
function initAnemone() {
  const a = REEF.anemone; if (!a) return;
  const pal = pick([['#c9a56b', '#ff7fa8', '#ff5c9a'], ['#9fb86a', '#c8ff7a', '#9dff5c'], ['#b88a6a', '#ffb070', '#ff8a3d']]);
  const tent = [];
  for (let i = 0; i < 96; i++) {
    const u = rand(-1, 1);
    tent.push({ u, a: -Math.PI / 2 + u * 1.25 + rand(-0.2, 0.2), len: U * rand(3.0, 4.6) * (1 - Math.abs(u) * 0.25), w: U * rand(0.4, 0.56), ph: rand(TAU), back: Math.random() < 0.5 });
  }
  tent.sort((p, q) => Math.abs(q.u) - Math.abs(p.u));
  LIFE.anemone = { x: a.x, y: a.y, R: U * 4, pal, tent, shrink: 0 };
}

function drawAnemone(g, t, part) {
  const A = LIFE.anemone; if (!A) return;
  const [base, tip] = A.pal, bRGB = hexRGB(base), tRGB = hexRGB(tip);
  if (part === 'back') {
    g.fillStyle = shadeHex(base, 0.35);
    g.beginPath(); g.ellipse(A.x, A.y + U * 0.2, A.R * 0.95, U * 1.1, 0, 0, TAU); g.fill();
  }
  const sh = 1 - A.shrink * 0.45;
  g.lineCap = 'round';
  for (const tn of A.tent) {
    if ((part === 'back') !== tn.back) continue;
    const bx = A.x + tn.u * A.R, by = A.y - Math.cos(tn.u * 1.2) * U * 0.6;
    const sway = 0.28 * Math.sin(t * 0.9 - bx * 0.018) + 0.1 * Math.sin(t * 2.3 + tn.ph);
    const L = tn.len * sh;
    const a1 = tn.a + sway * 0.6, a2 = tn.a + sway * 1.5;
    const mx = bx + Math.cos(a1) * L * 0.55, my = by + Math.sin(a1) * L * 0.55;
    const ex = mx + Math.cos(a2) * L * 0.5, ey = my + Math.sin(a2) * L * 0.5;
    const k = tn.back ? 0.25 : 0;
    g.strokeStyle = rgbStr(mixRGB(mixRGB(bRGB, tRGB, 0.35), [30, 20, 40], k)); g.lineWidth = tn.w;
    g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
    g.fillStyle = rgbStr(mixRGB(tRGB, [30, 20, 40], k)); g.beginPath(); g.arc(ex, ey, tn.w * 0.72, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.5)'; g.beginPath(); g.arc(ex - tn.w * 0.2, ey - tn.w * 0.25, tn.w * 0.22, 0, TAU); g.fill();
    tn.ex = ex; tn.ey = ey;
  }
}
function glowAnemone(g) {
  const A = LIFE.anemone; if (!A || TOD.night < 0.05) return;
  g.globalAlpha = 0.55 * TOD.night; const s = U * 1.4;
  const spr = A.pal[2] === '#9dff5c' ? GLOW.green : A.pal[2] === '#ff8a3d' ? GLOW.warm : GLOW.cyan;
  for (let i = 0; i < A.tent.length; i += 2) { const tn = A.tent[i]; if (tn.ex) g.drawImage(spr, tn.ex - s / 2, tn.ey - s / 2, s, s); }
  g.globalAlpha = 1;
}

/* ---------- seagrass ---------- */
function initGrass() {
  LIFE.grass = REEF.grass.map((c) => ({ ...c, front: c.y > H * 0.955, blades: Array.from({ length: c.n }, () => ({ dx: rand(-U * 1.4, U * 1.4), h: c.h * rand(0.55, 1.15), w: U * rand(0.32, 0.58), lean: rand(-0.25, 0.25), ph: rand(TAU), col: pick(['#3f8f4a', '#58a64e', '#2f7a44', '#6cb35a', '#4a9a6a']) })) }));
}
function drawGrass(g, t, front) {
  for (const c of LIFE.grass) {
    if (c.front !== front) continue;
    for (const b of c.blades) {
      const n = 7, pts = [];
      let x = c.x + b.dx, y = c.y, a = -Math.PI / 2 + b.lean;
      const seg = b.h / n;
      for (let i = 0; i <= n; i++) {
        pts.push([x, y, a]);
        const s = i / n;
        a += (0.08 * Math.sin(t * 1.1 - x * 0.01 + b.ph) + 0.05 * Math.sin(t * 2.6 + b.ph + i * 0.5) + 0.035) * (0.4 + s * 1.2);
        x += Math.cos(a) * seg; y += Math.sin(a) * seg;
      }
      b.pts = pts;
      g.beginPath();
      for (let i = 0; i <= n; i++) { const [px, py, pa] = pts[i], w = b.w * (1 - (i / n) * 0.75) * 0.5; const nx = -Math.sin(pa), ny = Math.cos(pa); i ? g.lineTo(px + nx * w, py + ny * w) : g.moveTo(px + nx * w, py + ny * w); }
      for (let i = n; i >= 0; i--) { const [px, py, pa] = pts[i], w = b.w * (1 - (i / n) * 0.75) * 0.5; const nx = -Math.sin(pa), ny = Math.cos(pa); g.lineTo(px - nx * w, py - ny * w); }
      g.closePath(); g.fillStyle = front ? shadeHex(b.col, 0.45) : b.col; g.fill();
      g.strokeStyle = 'rgba(220,255,200,0.25)'; g.lineWidth = 0.8; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke();
    }
  }
}

/* ---------- garden eels ---------- */
function initEels() {
  const b = REEF.eelBed; LIFE.eels = []; if (!b) return;
  const n = clamp(Math.round((b.x1 - b.x0) / (U * 1.9)), 3, 10);
  for (let i = 0; i < n; i++) {
    const x = lerp(b.x0, b.x1, (i + rand(0.2, 0.8)) / n), y = Math.min(H * 0.95, sandY(x) + U * rand(1.5, 5));
    LIFE.eels.push({ x, y, ext: rand(0.3, 1), tgt: 1, len: U * rand(5.5, 8.5) * lerp(0.8, 1.15, (y - H * 0.87) / (H * 0.08)), w: U * rand(0.42, 0.58), ph: rand(TAU), shy: rand(0.6, 1.4) });
  }
  LIFE.eels.sort((a, b2) => a.y - b2.y);
}
function updateEels(dt) {
  for (const e of LIFE.eels) {
    let tgt = TOD.night > 0.6 ? 0 : 1;
    for (const d of LIFE.danger) if (Math.abs(d.x - e.x) < d.r * e.shy && d.y > H * 0.45) tgt = 0;
    if (Math.random() < dt * 0.02) e.tgt2 = rand(0.4, 0.8);
    if (e.tgt2) { tgt = Math.min(tgt, e.tgt2); if (Math.random() < dt * 0.25) e.tgt2 = 0; }
    e.ext = ease(e.ext, tgt, tgt < e.ext ? 6 : 0.7, dt);
  }
}
function drawEels(g, t) {
  const cur = Math.sin(t * 0.13) > 0 ? -1 : 1;
  for (const e of LIFE.eels) {
    g.fillStyle = 'rgba(40,28,18,0.75)'; g.beginPath(); g.ellipse(e.x, e.y, e.w * 1.1, e.w * 0.38, 0, 0, TAU); g.fill();
    if (e.ext < 0.04) continue;
    const L = e.len * e.ext, n = 12, seg = L / n, pts = [];
    let x = e.x, y = e.y, a = -Math.PI / 2;
    for (let i = 0; i <= n; i++) {
      pts.push([x, y]);
      const s = i / n;
      a = -Math.PI / 2 + 0.18 * Math.sin(t * 1.2 + e.ph + s * 2.5) * s + cur * 1.5 * smooth((s - 0.62) / 0.38) * e.ext;
      x += Math.cos(a) * seg; y += Math.sin(a) * seg;
    }
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
    g.strokeStyle = '#3a3226'; g.lineWidth = e.w + 1.6; g.stroke();
    g.strokeStyle = '#e9e4d2'; g.lineWidth = e.w; g.stroke();
    g.fillStyle = '#1c1612';
    for (let i = 1; i < n; i++) { const [px, py] = pts[i]; g.beginPath(); g.arc(px + (i % 2 ? 1 : -1) * e.w * 0.18, py, e.w * 0.14, 0, TAU); g.fill(); }
    const [hx, hy] = pts[n];
    g.fillStyle = '#efe9d8'; g.beginPath(); g.arc(hx, hy, e.w * 0.62, 0, TAU); g.fill();
    g.fillStyle = '#111'; g.beginPath(); g.arc(hx + cur * e.w * 0.2, hy - e.w * 0.12, e.w * 0.2, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.arc(hx + cur * e.w * 0.26, hy - e.w * 0.2, e.w * 0.07, 0, TAU); g.fill();
    g.fillStyle = shadeHex('#d9c59a', 0.1); g.beginPath(); g.ellipse(e.x, e.y + e.w * 0.18, e.w * 0.9, e.w * 0.28, 0, 0, Math.PI); g.fill();
  }
}

/* ---------- treasure chest ---------- */
function initChest() { const c = REEF.chest; LIFE.chest = c ? { x: c.x, y: c.y, open: 0, tgt: 0, timer: rand(14, 26) } : null; }
function updateChest(dt) {
  const c = LIFE.chest; if (!c) return;
  c.timer -= dt;
  if (c.timer <= 0) {
    if (c.tgt === 0) { c.tgt = 1; c.timer = rand(3, 5); c.burst = 2.2; }
    else { c.tgt = 0; c.timer = rand(22, 40); }
  }
  c.open = ease(c.open, c.tgt, c.tgt ? 2.5 : 1.6, dt);
  if (c.burst > 0) { c.burst -= dt; if (c.open > 0.4 && Math.random() < dt * 34) spawnBubble(c.x + rand(-U * 2, U * 2), c.y - U * 3.2, U * rand(0.25, 0.9)); }
}
function drawChest(g) {
  const c = LIFE.chest; if (!c) return;
  const w = U * 6.2, h = U * 3.1, x = c.x, y = c.y;
  g.save(); g.translate(x, y); g.rotate(-0.05);
  contactShadow(g, 0, h * 0.1, w * 0.8);
  const wood = g.createLinearGradient(0, -h, 0, 0); wood.addColorStop(0, '#7a4a2a'); wood.addColorStop(1, '#3d2414');
  g.fillStyle = wood; g.fillRect(-w / 2, -h, w, h);
  g.strokeStyle = 'rgba(20,10,5,0.6)'; g.lineWidth = 1.2;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(-w / 2, -h + (i * h) / 4); g.lineTo(w / 2, -h + (i * h) / 4); g.stroke(); }
  g.fillStyle = 'rgba(40,110,90,0.35)'; for (let i = 0; i < 16; i++) { g.beginPath(); g.arc(rand(-w / 2, w / 2) * 0 + (i / 16 - 0.5) * w, -h * ((i * 37) % 10) / 10, U * 0.35, 0, TAU); g.fill(); }
  const brass = '#b88a2e';
  g.fillStyle = brass; g.fillRect(-w / 2 + w * 0.08, -h, w * 0.07, h); g.fillRect(w / 2 - w * 0.15, -h, w * 0.07, h);
  // opening
  const lift = c.open * h * 0.9;
  if (c.open > 0.02) {
    const gg = g.createRadialGradient(0, -h, 0, 0, -h, w * 0.5);
    gg.addColorStop(0, '#fff2a8'); gg.addColorStop(0.4, '#e8b030'); gg.addColorStop(1, '#6a4410');
    g.fillStyle = gg; g.beginPath(); g.ellipse(0, -h, w * 0.46, Math.max(1, lift * 0.45), 0, Math.PI, TAU); g.fill();
    g.fillStyle = '#ffe070'; for (let i = 0; i < 7; i++) { g.beginPath(); g.ellipse((i - 3) * w * 0.1, -h - lift * 0.12 - (i % 2) * U * 0.2, U * 0.4, U * 0.16, 0, 0, TAU); g.fill(); }
  }
  // lid
  g.save(); g.translate(0, -h - lift); g.scale(1, 1 - c.open * 0.45);
  const lg = g.createLinearGradient(0, -h * 0.55, 0, 0); lg.addColorStop(0, '#8e5a32'); lg.addColorStop(1, '#4e2e18');
  g.fillStyle = lg; g.beginPath(); g.moveTo(-w / 2, 0); g.bezierCurveTo(-w / 2, -h * 0.72, w / 2, -h * 0.72, w / 2, 0); g.closePath(); g.fill();
  g.fillStyle = brass; g.fillRect(-w / 2 + w * 0.08, -h * 0.55, w * 0.07, h * 0.55); g.fillRect(w / 2 - w * 0.15, -h * 0.55, w * 0.07, h * 0.55);
  g.fillRect(-w * 0.07, -h * 0.12, w * 0.14, h * 0.24);
  g.restore();
  g.fillStyle = '#d4a640'; g.fillRect(-w * 0.06, -h * 0.98 + (c.open > 0.2 ? h : 0) * 0, w * 0.12, h * 0.22);
  // sand drift covering the base
  g.fillStyle = '#cdb287'; g.beginPath(); g.ellipse(-w * 0.15, h * 0.05, w * 0.62, h * 0.24, 0, Math.PI, TAU); g.fill();
  g.restore();
}
function glowChest(g) { const c = LIFE.chest; if (!c || c.open < 0.05) return; g.globalAlpha = c.open * (0.35 + 0.5 * TOD.night); const s = U * 12; g.drawImage(GLOW.warm, c.x - s / 2, c.y - U * 3.6 - s / 2, s, s); g.globalAlpha = 1; }

/* ---------- bubbles ---------- */
function spawnBubble(x, y, r) { if (LIFE.bubbles.length < 420) LIFE.bubbles.push({ x, y, r, ph: rand(TAU), wf: rand(2, 5), pop: 0 }); }
function updateBubbles(dt) {
  const v = REEF.vent;
  if (v) { LIFE.ventT -= dt; if (LIFE.ventT < 0) { LIFE.ventT = Math.random() < 0.08 ? 0.02 : rand(0.1, 0.35); spawnBubble(v.x + rand(-2, 2), v.y, U * rand(0.1, 0.32)); } }
  const surf = H * 0.018;
  for (let i = LIFE.bubbles.length - 1; i >= 0; i--) {
    const b = LIFE.bubbles[i];
    if (b.pop > 0) { b.pop += dt * 3; if (b.pop > 1) LIFE.bubbles.splice(i, 1); continue; }
    b.y -= (U * 3.5 + b.r * 9) * dt;
    b.x += Math.sin(b.y * 0.03 + b.ph) * b.r * 1.4 * dt * b.wf;
    b.r *= 1 + 0.03 * dt;
    if (b.y < surf) b.pop = 0.01;
  }
}
function drawBubbles(g) {
  for (const b of LIFE.bubbles) {
    if (b.pop > 0) { g.strokeStyle = `rgba(230,255,255,${0.6 * (1 - b.pop)})`; g.lineWidth = 1; g.beginPath(); g.ellipse(b.x, b.y, b.r * (1 + b.pop * 3), b.r * 0.5 * (1 + b.pop * 2), 0, 0, TAU); g.stroke(); continue; }
    const s = b.r * 2 * (1 + 0.08 * Math.sin(b.y * 0.1 + b.ph));
    g.drawImage(BUBBLE, b.x - s / 2, b.y - b.r, s, b.r * 2);
  }
}

/* ---------- marine snow & bioluminescent sparks ---------- */
function initSnow() {
  LIFE.snow = [];
  const n = Math.round(clamp((W * H) / 8000, 60, 420));
  for (let i = 0; i < n; i++) LIFE.snow.push({ x: rand(W), y: rand(H), z: Math.pow(Math.random(), 0.7), ph: rand(TAU), s: rand(0.6, 1.4) });
}
function updateSnow(dt, t) {
  for (const p of LIFE.snow) {
    const sp = lerp(1.4, 0.5, p.z);
    p.y += U * 0.35 * sp * dt; p.x += (Math.sin(t * 0.25 + p.ph) * 0.4 + 0.15) * U * sp * dt;
    if (p.y > H + 10) { p.y = -10; p.x = rand(W); } if (p.x > W + 10) p.x = -10; if (p.x < -10) p.x = W + 10;
  }
}
function drawSnow(g, near) {
  for (const p of LIFE.snow) {
    const isNear = p.z < 0.12; if (isNear !== near) continue;
    if (near) { const s = U * (1.6 + (0.12 - p.z) * 14) * p.s; g.globalAlpha = 0.07 + 0.05 * Math.sin(p.ph); g.drawImage(GLOW.soft, p.x - s / 2, p.y - s / 2, s, s); }
    else { const s = U * lerp(0.42, 0.14, p.z) * p.s; g.globalAlpha = lerp(0.55, 0.18, p.z); g.drawImage(GLOW.dot, p.x - s / 2, p.y - s / 2, s, s); }
  }
  g.globalAlpha = 1;
}
function spark(x, y, s = 1) { if (LIFE.sparks.length < 600) LIFE.sparks.push({ x, y, life: 0, max: rand(0.5, 1.4), s: s * rand(0.6, 1.2) }); }
function updateSparks(dt) { for (let i = LIFE.sparks.length - 1; i >= 0; i--) { const s = LIFE.sparks[i]; s.life += dt; s.y -= U * 0.2 * dt; if (s.life > s.max) LIFE.sparks.splice(i, 1); } }
function drawSparks(g) {
  if (!LIFE.sparks.length) return;
  for (const s of LIFE.sparks) { const k = s.life / s.max, a = (k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85) * TOD.night; if (a < 0.02) continue; g.globalAlpha = a * 0.85; const r = U * 1.1 * s.s; g.drawImage(GLOW.cyan, s.x - r / 2, s.y - r / 2, r, r); }
  g.globalAlpha = 1;
}

/* ---------- food ---------- */
function dropFood(x, y, n = 14) {
  const cols = ['#e2842f', '#c7562b', '#8a6a2a', '#6c9a3a', '#d8b04a'];
  for (let i = 0; i < n; i++) LIFE.food.push({ x: x + rand(-U * 2.5, U * 2.5), y: y + rand(-U, U), vy: U * rand(1.6, 3.2), ph: rand(TAU), rot: rand(TAU), s: U * rand(0.22, 0.42), col: pick(cols), life: 0, rest: 0 });
}
function updateFood(dt, t) {
  for (let i = LIFE.food.length - 1; i >= 0; i--) {
    const f = LIFE.food[i]; f.life += dt;
    if (f.rest > 0) { f.rest += dt; if (f.rest > 14) LIFE.food.splice(i, 1); continue; }
    f.y += f.vy * dt; f.x += Math.sin(t * 1.3 + f.ph) * U * 0.6 * dt; f.rot += dt * 0.8;
    if (f.y >= reefTopAt(f.x) - U * 0.3) f.rest = 0.01;
  }
}
function drawFood(g) {
  for (const f of LIFE.food) {
    g.save(); g.translate(f.x, f.y); g.rotate(f.rot); g.globalAlpha = f.rest > 10 ? (14 - f.rest) / 4 : 1;
    g.fillStyle = f.col; g.beginPath(); g.moveTo(-f.s, -f.s * 0.4); g.lineTo(f.s * 0.8, -f.s * 0.6); g.lineTo(f.s, f.s * 0.5); g.lineTo(-f.s * 0.6, f.s * 0.5); g.closePath(); g.fill();
    g.restore();
  }
  g.globalAlpha = 1;
}

/* ---------- jellyfish ---------- */
class Jelly {
  constructor(kind) {
    this.kind = kind; this.z = rand(0.3, 0.85); this.r = U * rand(2.4, 3.6); this.x = rand(W); this.y = rand(H * 0.15, H * 0.55);
    this.vx = rand(-1, 1) * U * 0.5; this.vy = 0; this.ph = rand(TAU); this.per = rand(2.2, 3.2); this.tilt = 0;
    this.name = kind === 'moon' ? 'moon' : 'crystal';
  }
  get size() { return this.r * depthScale(this.z); }
  update(dt, t) {
    const c = ((t + this.ph) % this.per) / this.per;
    this.p = c < 0.3 ? Math.sin((c / 0.3) * Math.PI / 2) : Math.cos(((c - 0.3) / 0.7) * Math.PI / 2);
    const thrust = c < 0.3 ? U * 7 : 0;
    this.vy += (-thrust * Math.cos(this.tilt) + U * 1.1) * dt; this.vy *= Math.pow(0.35, dt);
    this.x += (this.vx + Math.sin(this.tilt) * -this.vy * 0.3) * dt; this.y += this.vy * dt;
    const low = Math.min(H * 0.66, reefTopAt(this.x) - this.r * 3);
    this.tilt = ease(this.tilt, this.y > low ? 0 : this.y < H * 0.14 ? 0.5 * sgn(this.vx) : 0.18 * Math.sin(t * 0.1 + this.ph), 0.5, dt);
    if (this.y < H * 0.1) this.vy += U * 3 * dt;
    if (this.x < -W * 0.15) this.x = W * 1.12; if (this.x > W * 1.15) this.x = -W * 0.12;
    if (TOD.night > 0.3 && this.kind === 'crystal' && Math.random() < dt * 3) spark(this.x + rand(-this.r, this.r) * depthScale(this.z), this.y + rand(0, this.r) * depthScale(this.z), 0.6);
  }
  draw(g, t) {
    const s = depthScale(this.z), fog = depthFog(this.z), r = this.r * s, p = this.p || 0;
    const w = r * (1 - 0.2 * p), h = r * 0.62 * (1 + 0.28 * p);
    g.save(); g.translate(this.x, this.y); g.rotate(this.tilt); g.globalAlpha = 1 - fog * 0.55;
    // tentacles
    g.strokeStyle = 'rgba(225,240,255,0.35)'; g.lineWidth = Math.max(0.6, r * 0.018);
    const nT = this.kind === 'moon' ? 34 : 22, tl = this.kind === 'moon' ? r * 0.35 : r * 1.8;
