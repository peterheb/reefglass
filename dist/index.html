  const day = TOD.day; if (day < 0.05) return;
  if (!SHADOW) SHADOW = makeGlow(32, [[0, 'rgba(6,14,28,0.85)'], [0.55, 'rgba(6,14,28,0.35)'], [1, 'rgba(6,14,28,0)']]);
  const ents = FISH.list.map((f) => [f.x, f.y, f.px, f.z]);
  const v = VIS.active; if (v && v.k && v.x !== undefined && !v.pod) ents.push([v.x, v.y, v.k * 0.7, v.z]);
  for (const [x, y, len, z] of ents) {
    if (z > 0.45) continue;                             // fish behind the front reef would shade reef we barely see
    const top = reefTopAt(x), h = top - y; if (h < 0 || h > H * 0.4) continue;
    const k = 1 - h / (H * 0.4), sx = x + (x - ENV.sunX) / H * h * 0.6, w = len * (0.9 + (1 - k) * 0.8);
    g.globalAlpha = 0.32 * day * k * k; g.drawImage(SHADOW, sx - w / 2, reefTopAt(sx) - w * 0.1, w, w * 0.26);
  }
  g.globalAlpha = 1;
}

function makeSchool(ids, n, zc) {
  const S = { members: [], tx: rand(0.2, 0.8) * W, ty: H * rand(0.3, 0.55), tz: zc, retarget: 0, spread: 1 };
  for (let i = 0; i < n; i++) {
    const sp = SPECIES[ids[i % ids.length] === 'anthias' && i % 9 === 4 ? 'anthiasM' : ids[i % ids.length]];
    const f = new Fish(sp, { x: S.tx + rand(-U * 12, U * 12), y: S.ty + rand(-U * 6, U * 6), z: clamp(zc + rand(-0.08, 0.08), 0.05, 0.95), school: S });
    f.offx = rand(-8, 8); f.offy = rand(-4, 4); f.offz = rand(-0.07, 0.07);
    S.members.push(f); FISH.list.push(f);
  }
  FISH.schools.push(S); return S;
}
function updateSchools(dt) {
  for (const S of FISH.schools) {
    S.retarget -= dt;
    const threat = LIFE.danger.find((d) => d.scare !== false && Math.abs(d.x - S.tx) < d.r * 1.3);
    if (threat) { S.tx = clamp(S.tx + sgn(S.tx - threat.x) * W * 0.2, W * 0.05, W * 0.95); S.ty = reefTopAt(S.tx) - U * 6; S.retarget = 4; }
    if (S.retarget <= 0) {
      S.retarget = rand(6, 14);
      const night = TOD.night > 0.6;
      S.tx = rand(-0.05, 1.05) * W;
      S.ty = night ? reefTopAt(S.tx) - U * rand(3, 6) : H * rand(0.18, 0.62);
      S.ty = Math.min(S.ty, reefTopAt(S.tx) - U * 5);
    }
  }
}

function spawnFish() {
  FISH.list = []; FISH.schools = [];
  const area = clamp((W * H) / (1920 * 1080), 0.42, 1.7);
  const solo = ['clown', 'bluetang', 'yellowtang', 'idol', 'emperor', 'copperband', 'mandarin', 'lion', 'porcupine', 'gramma', 'parrot', 'boxfish'];
  for (const id of solo) {
    const sp = SPECIES[id];
    const n = id === 'clown' ? 3 : Math.max(1, Math.round(sp.count * (area > 1 ? Math.sqrt(area) : area)));
    for (let i = 0; i < n; i++) FISH.list.push(new Fish(sp));
  }
  makeSchool(['anthias'], Math.round(clamp(20 * area, 10, 34)), 0.38);
  makeSchool(['chromis'], Math.round(clamp(24 * area, 10, 40)), 0.74);
  FISH.seahorse = new Seahorse();
}

/* =====================================================================
   3D materials in WebGL2.
   Creatures — every fish species, the seahorse and the special visitors are
   drawn as lit 3D models instead of flat sprites. Most are inflated from
   their own painted side view: the body outline (the path a painter passes
   to shade(), or else the painted silhouette) gets a rounded cross-section
   across its narrower dimension, fins stay thin sheets, and the painting,
   redone without baked shading or outlines, is the albedo on both flanks.
   Rigid parts (pectorals, flippers, sculling fins) hang off hinges with
   tilt/splay/roll; the octopus and the diver are built from tubes and
   ellipsoids. Swimming: a travelling body wave (sideways for fish and
   sharks, up-and-down for dolphins and whales), head recoil, rippling fin
   membranes, banking into turns, flapping manta wings.
   Shading is GGX with a guanine F0 (underwater, plain tissue reflects almost
   nothing), procedural scales plus relief from the painted pattern as the
   normal map, subsurface wrap, and sunlight through thin fins.
   Each model renders into its own tile of one offscreen canvas at the start
   of the frame; its draw() copies the tile in, so depth order, fog and
   grading work as before, and 2D overlays (streamers, eyes, lights) still
   draw on top.
   Reef — once per build, the painted back/front layers get a height field
   (multi-scale blur of the silhouette + the painting's luminance detail),
   micro relief (pitted rock, rippled grainy sand) and are re-lit from the
   sun. Only the relief is applied, so the painted light survives.
   Toggle everything with G.
   ===================================================================== */
const FGL = { on: false, want: true, gl: null, canvas: null, fish: null, blur: null, relit: null, quad: null, hdr: false, dyn: null, white: null, cache: {}, tiled: [] };

const GLSL_NOISE = `
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }
vec3 srgb(vec3 c) { return pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2)); }`;

/* ---------- creatures ---------- */
const FGL_FISH_VS = `#version 300 es
precision highp float;
in vec3 aPos; in vec3 aNrm; in vec2 aUV; in float aFin;
uniform vec2 uHalf, uGulp, uFish; uniform float uScale, uPX, uDepth, uPitch, uYaw, uRoll, uMirror;
uniform float uPhase, uAmp, uAxis, uFinAmp;
uniform vec4 uPart;     // hinge x, y, z; w = 1 for a rigid part, 0 for the body
uniform vec3 uPartRot;  // in-plane tilt, splay (about the part's y axis), roll (about its x axis)
uniform vec3 uFlap;     // wing flap: amplitude, phase, rigid half-width
out vec2 vUV, vWorld, vBody; out vec3 vN, vT, vB; out float vFin, vSide;
// travelling wave, growing toward the tail, plus a small counter-swing of the head (recoil)
float bend(float x) {
  float e = pow(clamp((0.3 - x) / 1.05, 0.0, 1.0), 1.5);
  return uAmp * (e * sin(uPhase - 5.6 * (0.5 - x)) - 0.12 * max(x, 0.0) * sin(uPhase + 0.6));
}
vec3 rotXY(vec3 v, float a) { float c = cos(a), s = sin(a); return vec3(v.x * c - v.y * s, v.x * s + v.y * c, v.z); }
vec3 rotYZ(vec3 v, float a) { float c = cos(a), s = sin(a); return vec3(v.x, v.y * c - v.z * s, v.y * s + v.z * c); }
vec3 rotXZ(vec3 v, float a) { float c = cos(a), s = sin(a); return vec3(v.x * c + v.z * s, v.y, -v.x * s + v.z * c); }
vec3 part(vec3 v) { return rotXZ(rotYZ(rotXY(v, uPartRot.x), uPartRot.z), uPartRot.y); }
// model (canvas y-down) -> view: mirror, roll, pitch (canvas rotation), y up, yaw
vec3 orient(vec3 v) { v.x *= uMirror; v = rotYZ(v, uRoll); v = rotXY(v, uPitch); v.y = -v.y; return rotXZ(v, uYaw); }
vec3 slopeZ(vec3 v, float m) { return vec3(v.x - v.z * m, v.y, v.z + v.x * m); }
vec3 slopeY(vec3 v, float m) { return vec3(v.x - v.y * m, v.y + v.x * m, v.z); }
void main() {
  vec3 p = aPos, n = aNrm;

  vec3 t = vec3(1.0, 0.0, 0.0) - n * n.x, b = vec3(0.0, 1.0, 0.0) - n * n.y;
  t = length(t) > 0.05 ? normalize(t) : normalize(cross(vec3(0.0, 1.0, 0.0), n));
  b = length(b) > 0.05 ? normalize(b) : normalize(cross(n, vec3(1.0, 0.0, 0.0)));

    float d = bend(p.x), m = (bend(p.x + 0.01) - d) / 0.01;

  vec2 px = p.xy * uScale;

}`;

const FGL_FISH_FS = `#version 300 es
precision highp float;
in vec2 vUV, vWorld, vBody; in vec3 vN, vT, vB; in float vFin, vSide;
uniform sampler2D uTex, uBg; uniform vec2 uTexel;
uniform float uDist, uCaus, uTime, uU, uDay, uSunX, uW, uH, uSSS, uBump;
uniform vec4 uMat;   // body roughness, fin roughness, scale size (body lengths; 0 = none), iridescence
uniform vec3 uTint, uEye;   // uEye: the painted eye (x, y, radius) in body units; radius 0 = none
uniform vec4 uRay[15]; uniform float uRayA[15]; uniform int uRayN;   // light shafts: top x, angle, width, length; strength
out vec4 o;
${GLSL_NOISE}
float caustic(vec2 p) {

// overlapping scales: staggered rows of arcs, each free edge raised and facing the tail
float scaleH(vec2 p) {

  vec3 up = vec3(0.95, 1.0, 1.05), side = vec3(0.5, 0.6, 0.68), down = vec3(0.5, 0.45, 0.38);
  return N.y > 0.0 ? mix(side, up, N.y) : mix(side, down, -N.y);
}
vec3 envSpec(vec3 R, float rough) {  // Snell's window overhead, open water elsewhere

// how much of the sun's shafts reach this point (the same shafts the 2D rays draw)
float shafts(vec2 p) {

  vec3 N = normalize(normalize(vN) - vSide * (g.x * normalize(vT) + g.y * normalize(vB)));

}`;

/* ---------- reef relight ---------- */
const FGL_QUAD_VS = `#version 300 es
in vec2 aPos; out vec2 vUV;
void main() { vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

// separable gaussian; the first pass turns the painting into (alpha, luminance·alpha)
const FGL_BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUV; uniform sampler2D uSrc; uniform vec2 uStep; uniform float uLod, uFirst;
out vec4 o;
vec4 fetch(vec2 uv) { vec4 c = textureLod(uSrc, uv, uLod); return uFirst > 0.5 ? vec4(c.a, dot(c.rgb, vec3(0.3, 0.59, 0.11)) * c.a, 0.0, 1.0) : c; }

  vec4 s = vec4(0.0); float ws = 0.0;
  for (int i = -6; i <= 6; i++) { float w = exp(-float(i * i) / 18.0); s += fetch(vUV + uStep * float(i)) * w; ws += w; }
  o = s / ws;
}`;

const FGL_RELIT_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uAlb, uS, uM, uL, uSand;
uniform vec2 uPx; uniform vec4 uGeo;   // W, H, bandTop, U (CSS px)
uniform float uSunX, uRelief, uPXr, uMask;
out vec4 o;
${GLSL_NOISE}
// height: rounded silhouettes at three scales + the painting's own light/dark detail
float hgt(vec2 uv) {
  vec4 s = texture(uS, uv), m = texture(uM, uv), l = texture(uL, uv);
  return 0.6 * l.x + 0.3 * m.x + 0.1 * s.x + 0.5 * (s.y - m.y);
}
// gradient of value noise (height per U, y down)
vec2 ngrad(vec2 q, float f) { float d = 0.3 / f, n = vnoise(q * f); return vec2(vnoise((q + vec2(d, 0.0)) * f) - n, vnoise((q + vec2(0.0, d)) * f) - n) / d; }

void main() {
  vec4 alb = texture(uAlb, vUV);

  vec2 p = vec2(vUV.x * uGeo.x, uGeo.z + (1.0 - vUV.y) * (uGeo.y - uGeo.z)), q = p / uGeo.w;
  float K = 110.0 * uRelief * uPXr;
  float gx = (hgt(vUV + vec2(uPx.x, 0.0)) - hgt(vUV - vec2(uPx.x, 0.0))) * 0.5 * K;
  float gy = (hgt(vUV + vec2(0.0, uPx.y)) - hgt(vUV - vec2(0.0, uPx.y))) * 0.5 * K;   // uv.y points up
  float sand = texture(uSand, vUV).r;   // r = open sand, g = rock
  vec3 floorN = normalize(vec3(0.0, 1.0, 0.55));
  vec3 N0 = mix(vec3(0.0, 0.0, 1.0), floorN, sand);
  vec3 N = mix(normalize(vec3(-gx, -gy, 1.0)), floorN, sand);
  // micro relief (slopes, y down): pitted rock and coral; sand ripples that widen toward the glass, and grain
  vec2 mg = (ngrad(q, 5.0) * 0.06 + ngrad(q, 17.0) * 0.02) * uRelief * (1.0 - sand);
  if (sand > 0.0) {

    float ph = 6.2832 * (q.y + 0.35 * sin(q.x * 0.9) + 0.8 * vnoise(q * 0.35)) / sp;

  float sh = 0.0;
  if (sand > 0.0) {

    for (int i = 1; i <= 6; i++) sh += textureLod(uSand, vUV + dir * float(i) * 0.014, 2.0).g;

    this.fish = Array.from({ length: 16 }, () => ({ ox: rand(-14, 14), oy: rand(-6, 6), ph: rand(TAU), on: rand(1, 3), off: 0, x: 0, y: 0, d: this.dir, s: rand(0.85, 1.15) }));
    for (const f of this.fish) { f.x = this.cx + f.ox * U; f.y = this.cy + f.oy * U; }
  }
  leave() { this.leaving = true; }
  update(dt, t) {
    this.t += dt; if (TOD.night < 0.3) this.leaving = true; this.cx += this.dir * U * (this.leaving ? 9 : 3.2) * dt; this.cy = Math.min(this.cy + Math.sin(this.t * 0.4) * U * 0.5 * dt, reefTopAt(this.cx) - U * 5);
    for (const f of this.fish) {
      const tx = this.cx + (f.ox + Math.sin(t * 0.5 + f.ph) * 4) * U, ty = this.cy + (f.oy + Math.cos(t * 0.6 + f.ph) * 2) * U;
      const vx = (tx - f.x) * 1.5; f.x += vx * dt; f.y += (ty - f.y) * 1.5 * dt; if (Math.abs(vx) > U * 0.5) f.d = sgn(vx);
      if (f.off > 0) { f.off -= dt; if (f.off <= 0) f.on = rand(1, 3.5); } else { f.on -= dt; if (f.on <= 0) f.off = rand(0.15, 0.45); }
    }
    this.x = this.cx; this.y = this.cy;
    const m = U * 26; return this.dir > 0 ? this.cx < W + m : this.cx > -m;
  }
  draw(g) {
    const k = U * 2.6;
    for (const f of this.fish) {
      if (f.glTile) {
        fglBlit(g, f);
        if (f.off <= 0) { g.save(); g.translate(f.x, f.y); g.scale(f.d * f.s, f.s); g.fillStyle = '#dffcff'; g.beginPath(); g.ellipse(k * 0.28, k * 0.05, k * 0.09, k * 0.05, 0, 0, TAU); g.fill(); g.restore(); }
        continue;
      }
      g.save(); g.translate(f.x, f.y); g.scale(f.d * f.s, f.s);
      g.fillStyle = '#0e1626'; g.beginPath(); g.ellipse(0, 0, k * 0.5, k * 0.22, 0, 0, TAU); g.fill();
      g.beginPath(); g.moveTo(-k * 0.45, 0); g.lineTo(-k * 0.75, -k * 0.2); g.lineTo(-k * 0.68, 0); g.lineTo(-k * 0.75, k * 0.2); g.fill();
      g.fillStyle = f.off > 0 ? '#1a2638' : '#dffcff'; g.beginPath(); g.ellipse(k * 0.28, k * 0.05, k * 0.09, k * 0.05, 0, 0, TAU); g.fill();
      g.fillStyle = '#2a3a50'; g.beginPath(); g.arc(k * 0.3, -k * 0.05, k * 0.05, 0, TAU); g.fill();
      g.restore();
    }
  }
  glow(g) {
    const s = U * 3.4;
    for (const f of this.fish) { if (f.off > 0) continue; g.globalAlpha = 0.9; g.drawImage(GLOW.cyan, f.x + f.d * U * 0.72 - s / 2, f.y + U * 0.13 - s / 2, s, s); }
    g.globalAlpha = 1;
  }
  hit(x, y) { for (const f of this.fish) if (Math.hypot(x - f.x, y - f.y) < U * 3) return 0.5; return -1; }
  anchor() { return [this.cx, this.cy - U * 8]; }
}

function summonVisitor(force) {
  const night = TOD.night > 0.55;
  let pool = VISITORS.filter((v) => (!v.night || night) && !(v.cave && !REEF.cave));
  const fresh = pool.filter((v) => !VIS.recent.includes(v.id)); if (fresh.length) pool = fresh;
  if (night) { const fl = pool.find((v) => v.night); if (fl && Math.random() < 0.45) pool = [fl]; }
  let sum = pool.reduce((a, v) => a + v.w, 0), r = Math.random() * sum, v = pool[0];
  for (const c of pool) { r -= c.w; if (r <= 0) { v = c; break; } }
  VIS.recent.push(v.id); if (VIS.recent.length > 5) VIS.recent.shift();
  VIS.active = v.make(v); VIS.pending = false;
  showCaption(v);
}
function callVisitor() {
  if (VIS.active) { VIS.active.leave?.(); VIS.pending = true; }
  else summonVisitor(true);
}
function updateVisitors(dt, t) {
  if (VIS.active) {
    if (!VIS.active.update(dt, t)) { VIS.active = null; VIS.next = VIS.pending ? 0.8 : TOD.mode === 'cycle' ? rand(35, 75) : rand(150, 420); }
  } else { VIS.next -= dt; if (VIS.next <= 0) summonVisitor(); }
}

function octopusSkin() {
  const c = mk(256, 256), g = c.getContext('2d');
  g.fillStyle = '#ece4dc'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(90,50,40,${rand(0.12, 0.3)})`; g.beginPath(); g.ellipse(rand(256), rand(256), rand(4, 14), rand(3, 9), rand(TAU), 0, TAU); g.fill(); }
  for (let i = 0; i < 500; i++) { g.fillStyle = 'rgba(255,248,240,0.45)'; g.beginPath(); g.arc(rand(256), rand(256), rand(0.8, 2.2), 0, TAU); g.fill(); }
  // two rows of suckers along the side of each arm that faces us (v ≈ 0.25)
  for (let x = 6; x < 256; x += 11) for (const y of [56, 72]) {
    g.fillStyle = '#f6eee4'; g.beginPath(); g.arc(x + (y > 60 ? 5 : 0), y, 4.5, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(120,70,60,0.5)'; g.lineWidth = 1; g.stroke();
  }
  return { t: fglTexture(c), texel: [1 / 256, 1 / 256] };
}

   Sound, interaction, render pipeline, boot
   ===================================================================== */
const AUDIO = {
  ctx: null, on: false, master: null, rev: null, timer: 0,
  ensure() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    const c = (this.ctx = new AC());
    this.master = c.createGain(); this.master.gain.value = 0; this.master.connect(c.destination);
    const len = c.sampleRate * 2.5, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 340; lp.Q.value = 0.6;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 140; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const ag = c.createGain(); ag.gain.value = 0.55; src.connect(lp); lp.connect(ag); ag.connect(this.master); src.start();
    const ir = c.createBuffer(2, c.sampleRate * 3, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const x = ir.getChannelData(ch); for (let i = 0; i < x.length; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / x.length, 2.6); }
    this.rev = c.createConvolver(); this.rev.buffer = ir; const rg = c.createGain(); rg.gain.value = 0.7; this.rev.connect(rg); rg.connect(this.master);
    return true;
  },
  toggle() {
    if (!this.ensure()) return false;
    this.on = !this.on; const c = this.ctx, g = this.master.gain;
    if (this.on) { c.resume(); g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0.9, c.currentTime, 0.6); }
    else { g.cancelScheduledValues(c.currentTime); g.setTargetAtTime(0, c.currentTime, 0.25); }
    return this.on;
  },
  blip(vol = 1, when = 0) {
    if (!this.on) return; const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain(), f = rand(380, 1100);
    o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * rand(1.6, 2.8), t + 0.07);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05 * vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g); g.connect(this.master); g.connect(this.rev); o.start(t); o.stop(t + 0.14);
  },
  bubbles(amt = 1) { if (!this.on) return; for (let i = 0; i < 6 + amt * 8; i++) this.blip(rand(0.4, 1), rand(0, 0.9)); },
  tick(dt) { if (!this.on) return; this.timer -= dt; if (this.timer < 0) { this.timer = rand(0.35, 1.6); this.blip(rand(0.25, 0.6)); } },
  whale() {
    if (!this.on) return; const c = this.ctx;
    let t = c.currentTime + 0.3;
    for (let n = 0; n < 5; n++) {
      const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), vib = c.createOscillator(), vg = c.createGain(), lp = c.createBiquadFilter();
      const f0 = rand(110, 380), f1 = f0 * rand(0.55, 1.8), d = rand(1.2, 2.6);
      o.type = 'sine'; o2.type = 'triangle'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d); o2.frequency.setValueAtTime(f0 * 2.01, t); o2.frequency.exponentialRampToValueAtTime(f1 * 2.01, t + d);
      vib.frequency.value = rand(4, 7); vg.gain.value = rand(3, 9); vib.connect(vg); vg.connect(o.frequency); vg.connect(o2.frequency);
      lp.type = 'lowpass'; lp.frequency.value = 900;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.35); g.gain.setValueAtTime(0.07, t + d - 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      const g2 = c.createGain(); g2.gain.value = 0.25; o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(this.rev); lp.connect(this.master);
      o.start(t); o2.start(t); vib.start(t); o.stop(t + d + 0.1); o2.stop(t + d + 0.1); vib.stop(t + d + 0.1);
      t += d + rand(0.4, 1.6);
    }
  },
};

/* ---------------- identification targets beyond fish ---------------- */
const JELLY_INFO = {
  moon: { name: 'Moon jellyfish', sci: 'Aurelia aurita', fact: 'No brain, heart or bones — a simple nerve net keeps the bell pulsing. The four rings are its gonads.' },
  crystal: { name: 'Crystal jelly', sci: 'Aequorea victoria', fact: 'Source of green fluorescent protein (GFP), a glowing lab tool that earned a Nobel Prize in 2008.' },
};
Jelly.prototype.hit = function (x, y) { const r = this.r * depthScale(this.z) * 1.1; const d = Math.hypot(x - this.x, y - this.y); return d < r ? d / r : -1; };
Jelly.prototype.anchor = function () { return [this.x, this.y - this.r * depthScale(this.z) * 0.6]; };
const EEL_ENT = { z: 0.2, info: { name: 'Spotted garden eel', sci: 'Heteroconger hassi', fact: 'A colony anchored tail-first in sand burrows, picking plankton from the current. They vanish when something big swims by.' },
  hit(x, y) { const b = REEF.eelBed; if (!b) return -1; return x > b.x0 - U * 2 && x < b.x1 + U * 2 && y > H * 0.8 && y < H * 0.97 ? 0.8 : -1; }, anchor() { const b = REEF.eelBed; return [(b.x0 + b.x1) / 2, H * 0.84]; } };
const ANEMONE_ENT = { z: 0.215, info: { name: 'Bubble-tip anemone', sci: 'Entacmaea quadricolor', fact: 'Home base for the clownfish. Its stinging tentacles swell into bulbs at the tips.' },
  hit(x, y) { const A = LIFE.anemone; if (!A) return -1; const d = Math.hypot(x - A.x, (y - (A.y - U * 1.5)) * 1.3); return d < A.R * 1.3 ? 0.9 : -1; }, anchor() { const A = LIFE.anemone; return [A.x, A.y - U * 3]; },
  draw(g) { drawAnemone(g, CLOCK.t, 'front'); } };

/* ---------------- labels & captions ---------------- */
const tagEl = document.getElementById('tag'), capEl = document.getElementById('caption');
const LABEL = { ent: null, until: 0 };
function identify(ent) {
  const info = ent.info; if (!info) return;
  tagEl.querySelector('.tag-name').textContent = info.name;
  tagEl.querySelector('.tag-sci').textContent = info.sci;
  tagEl.querySelector('.tag-fact').textContent = info.fact;
  LABEL.ent = ent; LABEL.until = CLOCK.t + 7; tagEl.classList.add('show');
}
function placeLabel(g) {
  if (!LABEL.ent) return;
  if (CLOCK.t > LABEL.until || (LABEL.ent.kind === 'visitor' && LABEL.ent !== VIS.active)) { tagEl.classList.remove('show'); LABEL.ent = null; return; }
  const f = par(LABEL.ent.z), [ax, ay] = LABEL.ent.anchor().map((v, i) => v + (i ? CAM.y : CAM.x) * f);
  const tw = tagEl.offsetWidth, th = tagEl.offsetHeight;
  let tx = ax + U * 3, ty = ay - th - U * 4;
  if (tx + tw > W - 16) tx = ax - tw - U * 3;
  tx = clamp(tx, 16, W - tw - 16); ty = clamp(ty, 16, H - th - 16);
  tagEl.style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px)`;
  const cx = clamp(ax, tx, tx + tw), cy = clamp(ay, ty, ty + th);
  g.strokeStyle = 'rgba(230,250,248,0.75)'; g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(ax, ay); g.lineTo(cx, cy); g.stroke(); g.setLineDash([]);
  g.fillStyle = 'rgba(230,250,248,0.95)'; g.beginPath(); g.arc(ax, ay, 2.5, 0, TAU); g.fill();
}
let capTimer = 0;
function showCaption(v) {
  if (body.classList.contains('idle')) return;
  capEl.querySelector('.cap-name').textContent = v.name;
  capEl.querySelector('.cap-sci').textContent = v.sci;
  capEl.querySelector('.cap-fact').textContent = v.fact;
  capEl.classList.add('show'); clearTimeout(capTimer); capTimer = setTimeout(() => capEl.classList.remove('show'), 8500);
}

/* ---------------- render ---------------- */
const CLOCK = { t: 0 };
const buckets = { far: [], mid: [], near: [] };
// shift the view for a layer at parallax factor f
function view(g, f) { g.setTransform(PX, 0, 0, PX, CAM.x * f * PX, CAM.y * f * PX); }
function drawList(g, list, t) { for (const e of list) { view(g, par(e.z)); e.draw(g, t); } }
const REEF_BACK = 0.45, REEF_FRONT = 0.75;
function render(t) {
  const g = ctx;
  g.setTransform(PX, 0, 0, PX, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  // sprites carry their own mips, so bilinear is enough; 'high' roughly halves the frame rate
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'low';
  const P = CAM.pad;
  view(g, 0.1); g.drawImage(ENV.bg, -P, -P * 0.5, W + 2 * P, H + P);
  view(g, 0.15); drawSurface(g, t);
  buckets.far.length = buckets.mid.length = buckets.near.length = 0;
  const all = [...FISH.list, ...LIFE.jellies];
  if (VIS.active) all.push(VIS.active);
  if (FISH.seahorse) all.push(FISH.seahorse);
  if (LIFE.anemone) all.push(ANEMONE_ENT);
  for (const e of all) (e.z > 0.62 ? buckets.far : e.z > 0.3 ? buckets.mid : buckets.near).push(e);
  for (const b of Object.values(buckets)) b.sort((a, c) => c.z - a.z);
  updateRays(t); fglPrepare(all, t);
  const bt = REEF.bandTop, bh = H - bt;
  drawList(g, buckets.far, t);
  view(g, 0.4); drawRays(g);
  view(g, 0.55); drawSnow(g, false);
  view(g, REEF_BACK); g.drawImage(reefLayer('back'), -P, bt, W + 2 * P, bh); drawSoftCorals(g, 'back', t);
  drawList(g, buckets.mid, t);
  view(g, REEF_FRONT); g.drawImage(reefLayer('front'), -P, bt, W + 2 * P, bh); drawSoftCorals(g, 'front', t);
  drawCaustics(g, t); drawShadows(g);
  drawEels(g, t); drawMoray(g); drawAnemone(g, t, 'back'); drawGrass(g, t, false); drawChest(g); drawCrab(g);
  drawList(g, buckets.near, t);
  view(g, 0.9); drawFood(g); drawBubbles(g);
  drawGrass(g, t, true);
  view(g, 1.3); g.drawImage(REEF.fg, -P * 1.8, bt, W + 3.6 * P, bh);
  view(g, 1.1); drawSnow(g, true);
  view(g, 0); drawGrade(g);
  // light that survives the dark: fluorescence, bioluminescence, torches
  g.globalCompositeOperation = 'lighter';
  view(g, REEF_FRONT);
  if (TOD.night > 0.02) { g.globalAlpha = TOD.night * (0.62 + 0.1 * Math.sin(t * 0.5)); g.drawImage(REEF.fluo, -P, bt, W + 2 * P, bh); g.globalAlpha = 1; }
  glowAnemone(g); glowChest(g);
  for (const j of LIFE.jellies) { view(g, par(j.z)); j.glow(g); }
  if (VIS.active && VIS.active.glow) { view(g, par(VIS.active.z)); VIS.active.glow(g); }
  view(g, 0.8); drawSparks(g);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  view(g, 0); g.drawImage(ENV.vignette, 0, 0, W, H);
  placeLabel(g);
}

/* ---------------- update ---------------- */
let clockTick = 0;
const clockEl = document.getElementById('clock');
function update(dt, t) {
  updateTOD(dt); updateCurrent(t); updateCam(dt, t, !body.classList.contains('idle'));
  LIFE.danger.length = 0;
  updateVisitors(dt, t);
  updateSchools(dt);
  for (const f of FISH.list) f.update(dt, t);
  FISH.seahorse && FISH.seahorse.update(dt);
  for (const j of LIFE.jellies) j.update(dt, t);
  updateEels(dt); updateMoray(dt); updateCrab(dt); updateChest(dt); updateBubbles(dt); updateSnow(dt, t); updateSparks(dt); updateFood(dt, t);
  const A = LIFE.anemone; if (A) { const near = LIFE.danger.some((d) => Math.abs(d.x - A.x) < d.r && d.y > H * 0.3); A.shrink = ease(A.shrink, near ? 1 : TOD.night * 0.3, 2, dt); }
  if (LIFE.chest && LIFE.chest.burst > 2.1 && !LIFE.chest.sounded) { LIFE.chest.sounded = true; AUDIO.bubbles(1); } if (LIFE.chest && LIFE.chest.burst <= 0) LIFE.chest.sounded = false;
  AUDIO.tick(dt);
  clockTick -= dt; if (clockTick < 0) { clockTick = 1; clockEl.textContent = todLabel(); }
}

/* ---------------- build / rebuild ---------------- */
let rebuildTimer = 0;
function rebuild() {
  const oW = W, oH = H;
  measure(); buildEnvironment(); buildReef();
  const sx = W / oW, sy = H / oH;
  for (const f of FISH.list) { f.x *= sx; f.y *= sy; f.tx *= sx; f.ty *= sy; }
  for (const S of FISH.schools) { S.tx *= sx; S.ty *= sy; }
  for (const j of LIFE.jellies) { j.x *= sx; j.y *= sy; }
  initAnemone(); initGrass(); initEels(); initChest(); initSnow(); initMoray(); initCrab(); FISH.seahorse = new Seahorse();
  if (VIS.active && VIS.active instanceof Octopus) VIS.active = null;
}
function requestRebuild() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 250); }
addEventListener('resize', () => { if (Math.abs(innerWidth - W) > 2 || Math.abs(innerHeight - H) > 2) requestRebuild(); });

/* ---------------- interaction ---------------- */
function pickAt(x, y) {
  let best = null, bs = 9;
  const cands = [...FISH.list, ...LIFE.jellies, EEL_ENT, ANEMONE_ENT, MORAY, CRAB];
  if (FISH.seahorse) cands.push(FISH.seahorse);
  if (VIS.active) cands.push(VIS.active);
  for (const e of cands) { const f = par(e.z), h = e.hit(x - CAM.x * f, y - CAM.y * f); if (h >= 0) { const s = h + e.z * 0.8; if (s < bs) { bs = s; best = e; } } }
  return best;
}
cv.addEventListener('pointerdown', (ev) => {
  wake();
  const x = ev.clientX, y = ev.clientY, e = pickAt(x, y);
  if (e) { identify(e); if (e.tapped) e.tapped(); if (e.sp && e.sp.inflSpr) e.inflT = 4; }
  else { dropFood(x, y, 12); AUDIO.blip(0.5); }
});

const body = document.body;
let idleTimer = 0, dockHover = false;
function wake() { body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!dockHover) { body.classList.add('idle'); body.classList.remove('open'); capEl.classList.remove('show'); tagEl.classList.remove('show'); LABEL.ent = null; } }, 3800); }
addEventListener('pointermove', (e) => { CAM.px = (e.clientX / W - 0.5) * 2; CAM.py = (e.clientY / H - 0.5) * 2; wake(); }, { passive: true });
addEventListener('keydown', (e) => {
  wake();
  if (e.target.closest && e.target.closest('button')) return;
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'v' || e.key === 'V') callVisitor();
  else if (e.key === 'g' || e.key === 'G') fglToggle();
  else if (e.key === ' ') { e.preventDefault(); feed(); }
});
const dock = document.getElementById('dock');
dock.addEventListener('pointerenter', () => { dockHover = true; wake(); });
dock.addEventListener('pointerleave', () => { dockHover = false; wake(); });
dock.addEventListener('focusin', () => { dockHover = true; body.classList.add('open'); wake(); });
dock.addEventListener('focusout', () => { dockHover = false; if (!body.classList.contains('idle')) wake(); }); // hiding the panel blurs it; don't wake on that

// stray mouse movement reveals just a small handle; the panel opens on click, and once on load
const dockTab = document.getElementById('dockTab');
dockTab.addEventListener('click', () => { body.classList.add('open'); wake(); dock.querySelector('[aria-pressed="true"]').focus(); });
body.classList.add('open');

function setMode(m) { TOD.mode = m; liveT = 99; try { localStorage.setItem('reefglass.mode', m); } catch (_) {} document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m))); clockTick = 0; }
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
function feed() { dropFood(rand(0.2, 0.8) * W, H * 0.1, 20); AUDIO.blip(0.6); }
document.getElementById('btnFeed').addEventListener('click', feed);
document.getElementById('btnVisitor').addEventListener('click', callVisitor);
const btnSound = document.getElementById('btnSound');
btnSound.addEventListener('click', () => { const on = AUDIO.toggle(); btnSound.setAttribute('aria-pressed', String(on)); btnSound.querySelector('span').textContent = on ? 'Sound on' : 'Sound off'; });
let wakeLock = null;
async function toggleFull() {
  try {
    if (!document.fullscreenElement) { await document.documentElement.requestFullscreen(); if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen').catch(() => null); }
    else await document.exitFullscreen();
  } catch (_) { /* fullscreen not available in this view */ }
}
document.getElementById('btnFull').addEventListener('click', toggleFull);
document.addEventListener('fullscreenchange', () => { const b = document.getElementById('btnFull'); b.lastChild.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

/* ---------------- boot ---------------- */
function boot() {
  measure(); buildGlows(); buildBubbleSprite(); buildSpecies(); fglInit();
  buildEnvironment(); buildReef();
  initAnemone(); initGrass(); initEels(); initChest(); initSnow(); initJellies(); initMoray(); initCrab(); spawnFish();
  for (const j of LIFE.jellies) j.info = JELLY_INFO[j.kind];
  // settle the scene so the first frame already looks alive
  for (let i = 0; i < 90; i++) { CLOCK.t += 1 / 30; update(1 / 30, CLOCK.t); }
  try { const m = localStorage.getItem('reefglass.mode'); if (['live', 'cycle', 'day', 'night'].includes(m)) setMode(m); } catch (_) {}
  if (TOD.mode === 'live') { const s = liveState(); TOD.day = s.day; TOD.warm = s.warm; TOD.night = 1 - s.day; }
  VIS.next = TOD.mode === 'cycle' ? 12 : 45;
  wake();
  let last = performance.now();
  const loop = (now) => {
    requestAnimationFrame(loop);
    if (now - last < 10) return; // hold ~60 fps on 120/144 Hz displays; a slow ambient scene gains nothing from more
    const ms = clamp(now - last, 0, 100); last = Math.max(last, now);
    const dt = Math.min(0.05, ms / 1000); CLOCK.t += dt;
    update(dt, CLOCK.t); render(CLOCK.t); governPerf(ms);
  };
  requestAnimationFrame(loop);
}
window.reef = { summon(id) { const v = VISITORS.find((q) => q.id === id); if (v) { VIS.active = v.make(v); showCaption(v); } }, mode: setMode, feed, gl: fglToggle, advance(s) { for (let i = 0; i < s * 30; i++) { CLOCK.t += 1 / 30; update(1 / 30, CLOCK.t); } } };
boot();

</script>
